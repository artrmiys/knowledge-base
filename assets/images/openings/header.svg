<text class="mono2" x="540" y="369">Plates Ext (2) dbl top | LFT</text>
<line x1="40" y1="470" x2="840" y2="470" stroke="#dfe3e8" stroke-width="1.2"/>
<text class="h" x="40" y="500">(2) и (3) в имени и в подписи строки = plies</text>
<rect x="40" y="518" width="17" height="56" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="57" y="518" width="17" height="56" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<text class="mono" x="86" y="540">ext H228 4</text>
<text class="note" x="86" y="560">(2) 2x8: две доски</text>
<rect x="300" y="518" width="17" height="56" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="317" y="518" width="17" height="56" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="334" y="518" width="17" height="56" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<text class="mono" x="363" y="540">ext (3) 2x10 8</text>
<text class="note" x="363" y="560">(3) 2x10: три доски</text>
<text class="ink" x="560" y="516">Один header = одна точка Count,</text>
<text class="ink" x="560" y="535">не n точек. В C идут все доски:</text>
<text class="ink" x="560" y="554">точки x plies. Размер и plies</text>
<text class="ink" x="560" y="573">из header schedule.</text>
