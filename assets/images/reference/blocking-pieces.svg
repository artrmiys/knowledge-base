<rect x="152" y="380" width="26" height="12" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<rect x="242" y="380" width="26" height="12" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<rect x="332" y="380" width="26" height="12" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<rect x="422" y="380" width="26" height="12" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<rect x="512" y="380" width="26" height="12" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<rect x="602" y="380" width="26" height="12" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<line x1="60" y1="448" x2="600" y2="448" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="330.0" y="441.0" text-anchor="middle">G = длина линии, ft</text>
<line x1="75" y1="342" x2="165" y2="342" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="176" y="347">H = шаг точек, дюймы (48")</text>
<rect x="40" y="478" width="800" height="92" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="mono" x="56" y="504">Blocking 48" o.c.   =CEILING(G*12/H*2/D,1)   D 16</text>
<text class="ink" x="56" y="526">G*12/H = число точек; 2 (или 2.5, 1.5) = ft доски на точку; /D = доски по 16'.</text>
<text class="ink" x="56" y="548">Пример: G = 60, H = 48: 15 точек x 2 ft = 30 ft / 16 = 1.9, в книгу 2 доски.</text>
<text class="note" x="634" y="362">Joists или studs</text>
<text class="note" x="634" y="381">идут поперёк линии.</text>
<text class="note" x="634" y="400">Линия одна, куски</text>
<text class="note" x="634" y="419">считает формула.</text>
</svg>
