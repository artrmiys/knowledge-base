<polygon points="373,94 385,94 505,196 505,206 493,206 373,104" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="336" cy="94" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="336" y="98.5">2</text>
<text class="lab2" x="439.0" y="232" text-anchor="middle">Diagonal: 2.5 ft на точку</text>
<text class="note" x="439.0" y="252" text-anchor="middle">доска по диагонали</text>
<rect x="588" y="70" width="250" height="196" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="10"/>
<rect x="633" y="90" width="14" height="120" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="779" y="90" width="14" height="120" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="647" y="94" width="132" height="112" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.8"/>
<circle cx="610" cy="94" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="610" y="98.5">3</text>
<text class="lab2" x="713.0" y="232" text-anchor="middle">Vertical: 1.5 - 2 ft на точку</text>
<text class="note" x="713.0" y="252" text-anchor="middle">доска на ребро, по шагу</text>
<text class="side" x="40" y="306">ЛИНИЯ В ДЕРЕВЕ И ТОЧКИ ПО ШАГУ, план</text>
<line x1="60" y1="350" x2="60" y2="422" stroke="#b9a27c" stroke-width="3"/>
