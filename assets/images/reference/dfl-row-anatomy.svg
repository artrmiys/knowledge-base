  <title id="t">Anatomy of a DFL row, columns A to H</title>
  <desc id="d">Excel mock of a framing list: header, note and three material rows. Each column A to H carries a lettered badge; the legend below says what the column holds. Column D is the stock length for lumber ordered by the piece and a unit for everything else.</desc>
