<rect x="692" y="278" width="150" height="26" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<text class="xl" x="578" y="296.0">24" o.c.</text>
<text class="xl" x="767.0" y="296.0" text-anchor="middle">0.625</text>
<text class="mono" x="572" y="334">=CEILING(G*1.1,1)</text>
<text class="ink" x="572" y="356">100 LFT x 1.1 = 110 pcs</text>
