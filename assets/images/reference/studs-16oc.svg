<text class="xlh" x="767.0" y="220" text-anchor="middle">pcs на LFT</text>
<rect x="572" y="226" width="120" height="26" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<rect x="692" y="226" width="150" height="26" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<text class="xl" x="578" y="244.0">12" o.c.</text>
<text class="xl" x="767.0" y="244.0" text-anchor="middle">1.4667</text>
<rect x="572" y="252" width="120" height="26" fill="#eaf5ea" stroke="#3a3f44" stroke-width="0.7"/>
<rect x="692" y="252" width="150" height="26" fill="#eaf5ea" stroke="#3a3f44" stroke-width="0.7"/>
