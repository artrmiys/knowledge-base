<text class="h" x="572" y="60">Правило по стойкам</text>
<rect x="572" y="78" width="20" height="14" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.2"/>
<text class="ink" x="602" y="91">рядовые: 12 / 16 = 0.75 на ft</text>
<rect x="572" y="104" width="20" height="14" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.6"/>
<text class="ink" x="602" y="117">добавка: углы, T, проёмы</text>
<text class="inkb" x="572" y="152">Считаем 1 стойку на ft стены</text>
<text class="inkb" x="572" y="172">плюс 10% waste: фактор 1.1</text>
<rect x="572" y="204" width="120" height="22" fill="#f2f3f5" stroke="#3a3f44" stroke-width="0.6"/>
<text class="xlh" x="632.0" y="220" text-anchor="middle">Spacing</text>
