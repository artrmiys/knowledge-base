<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" role="img" aria-labelledby="t d">
  <title id="t">Two kinds of notes in the DFL: main notes in the header, local notes under a block title</title>
  <desc id="d">Spreadsheet fragment: Detailed Material List, three yellow rows with red bold main notes, the Description header, then the 1st Floor Walls block title with a yellow local note in regular black text and material rows. Callouts explain placement and formatting.</desc>
