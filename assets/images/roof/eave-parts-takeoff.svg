<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-labelledby="t d">
  <title id="t">Eave section: what one eave line gives</title>
  <desc id="d">Section through an eave: wall with top plates, raised-heel truss with its tail, roof sheathing, sub fascia and fascia at the tail end, soffit frame and soffit panel back to the wall, frieze board, trim over fascia, blocking and tie at the plate, truss heel sheathing. Each part is numbered as a DFL row with its unit.</desc>
