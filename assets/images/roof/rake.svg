<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" role="img" aria-labelledby="t d">
  <title id="t">Rake: the sloped roof edge at a gable</title>
  <desc id="d">Top left: gable end elevation with the rake boards along both slopes and the eave ends at the low corners. Top right: roof plan with the overhang, rake lines on the gable sides and eave lines on the low sides. Bottom: section through the rake overhang with soffit, fascia, sub fascia, lookouts and rake moulding numbered as DFL rows.</desc>
