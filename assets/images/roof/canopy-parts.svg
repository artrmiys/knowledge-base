<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
  <title id="t">Canopy section: ledger or steel plate at the wall, joists, edge beam, decking, tapered layer, soffit</title>
  <desc id="d">Section through a canopy: house wall with a ledger (or steel plate) and anchors, canopy joists in hangers, an edge beam at the outer end, 3/4 inch T and G decking with a tapered layer on top, 5/8 inch glass mat soffit below, fascia at the edge. Callouts give the DFL rows.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#2e7d32"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="gyp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#eef0f2"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    
    <style>
      .ln{fill:none;stroke:#3a3f44;stroke-width:1.6;stroke-linejoin:round}
      .thin{fill:none;stroke:#3a3f44;stroke-width:1.1}
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .small{font:400 12.5px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 13px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .lead{stroke:#2e7d32;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .leadInk{stroke:#3a3f44;stroke-width:1.3;fill:none;marker-end:url(#arrInk)}
      .leadRed{stroke:#c62828;stroke-width:1.5;fill:none;marker-end:url(#arrRed)}
      .dim{stroke:#3a3f44;stroke-width:1.1;fill:none;marker-start:url(#tick);marker-end:url(#tick)}
      .dimt{font:500 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numc{fill:#2e7d32;stroke:#fff;stroke-width:1.5}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .h{font:700 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .cap{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="599" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<rect x="820" y="60" width="40" height="480" fill="url(#batt)" stroke="#caa64a" stroke-width="1" />
<rect x="820" y="60" width="40" height="480" fill="none" stroke="#3a3f44" stroke-width="1.4" />
<rect x="812" y="60" width="8" height="480" fill="#d7c3a6" stroke="#8a6a3f" stroke-width="1.2" />
<text class="side" x="826" y="570" >HOUSE</text>
<rect x="798" y="200" width="14" height="90" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6" />
<line x1="790" y1="222" x2="826" y2="222" stroke="#4d5861" stroke-width="4"/><line x1="790" y1="268" x2="826" y2="268" stroke="#4d5861" stroke-width="4"/><rect x="260" y="200" width="538" height="90" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4" />
<path d="M798,204 V286 H774 V204" fill="none" stroke="#4d5861" stroke-width="3"/><rect x="230" y="200" width="30" height="90" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.6" />
<line x1="245" y1="200" x2="245" y2="290" stroke="#8a6a3f" stroke-width="1"/><rect x="222" y="188" width="590" height="12" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.3" />
<polygon points="222.0,188.0 812.0,188.0 812.0,150.0 222.0,176.0" fill="url(#rigid)" stroke="#b8862b" stroke-width="1.2" stroke-linejoin="round" />
<rect x="222" y="290" width="590" height="8" fill="#eef0f2" stroke="#9aa4ad" stroke-width="1.3" />
<rect x="206" y="140" width="16" height="164" fill="#f7f3ea" stroke="#8a6a3f" stroke-width="1.4" />
<path d="M222,176 L812,150 V140" fill="none" stroke="#333" stroke-width="2.5"/><circle class="numc" cx="805" cy="180" r="11"/><text class="numt" x="805" y="184.5">1</text>
<circle class="numc" cx="784" cy="320" r="11"/><text class="numt" x="784" y="324.5">2</text>
<circle class="numc" cx="520" cy="245" r="11"/><text class="numt" x="520" y="249.5">3</text>
<circle class="numc" cx="245" cy="320" r="11"/><text class="numt" x="245" y="324.5">4</text>
<circle class="numc" cx="520" cy="194" r="11"/><text class="numt" x="520" y="198.5">5</text>
<circle class="numc" cx="520" cy="160" r="11"/><text class="numt" x="520" y="164.5">6</text>
<circle class="numc" cx="520" cy="320" r="11"/><text class="numt" x="520" y="324.5">7</text>
<circle class="numc" cx="214" cy="120" r="11"/><text class="numt" x="214" y="124.5">8</text>
<circle class="numc" cx="71" cy="347" r="11"/><text class="numt" x="71" y="351.5">1</text>
<text class="lab2" x="90" y="352" >Ledger или steel plate + anchors</text>
<text class="mono2" x="90" y="369" >Ledger | 2x10 | LFT; Anchors | pcs</text>
<circle class="numc" cx="71" cy="397" r="11"/><text class="numt" x="71" y="401.5">2</text>
<text class="lab2" x="90" y="402" >Hangers у ledger</text>
<text class="mono2" x="90" y="419" >Hangers | LUS210 | pcs</text>
<circle class="numc" cx="71" cy="447" r="11"/><text class="numt" x="71" y="451.5">3</text>
<text class="lab2" x="90" y="452" >Canopy joists</text>
<text class="mono2" x="90" y="469" >Joists | 2x10 16" | LFT / pcs</text>
<circle class="numc" cx="71" cy="497" r="11"/><text class="numt" x="71" y="501.5">4</text>
<text class="lab2" x="90" y="502" >Edge beam по краю</text>
<text class="mono2" x="90" y="519" >Beam | (2) 2x10 | LFT</text>
<circle class="numc" cx="491" cy="347" r="11"/><text class="numt" x="491" y="351.5">5</text>
<text class="lab2" x="510" y="352" >Decking 3/4" T&amp;G</text>
<text class="mono2" x="510" y="369" >Subfloor | 3/4" T&amp;G | SQ FT</text>
<circle class="numc" cx="491" cy="397" r="11"/><text class="numt" x="491" y="401.5">6</text>
<text class="lab2" x="510" y="402" >Tapered (уклон) + кровля</text>
<text class="mono2" x="510" y="419" >Tapered | по детали; кровля by others</text>
<circle class="numc" cx="491" cy="447" r="11"/><text class="numt" x="491" y="451.5">7</text>
<text class="lab2" x="510" y="452" >Soffit 5/8" glassmat</text>
<text class="mono2" x="510" y="469" >Soffit | 5/8" Glassmat | SQ FT</text>
<circle class="numc" cx="491" cy="497" r="11"/><text class="numt" x="491" y="501.5">8</text>
<text class="lab2" x="510" y="502" >Fascia по краю</text>
<text class="mono2" x="510" y="519" >Fascia | LFT (Exterior Trims)</text>
<text class="lab" x="60" y="50" >Canopy над входом, разрез</text>
<text class="note" x="60" y="70" >в дереве: sqfts/canopy (Area), joists в framing; soffit в canopy scope, не в eve</text>
<text class="small" x="60" y="580" >Steel plate с анкерами вместо ledger: пластина by others, anchors и wood nailer наши, если detail показывает.</text>
</svg>
