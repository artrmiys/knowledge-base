  <title id="t">Roof-to-wall flashing: step flashing and kick-out</title>
  <desc id="d">Elevation of a lower roof slope meeting a side wall: step flashing pieces run up the slope under the siding, a kick-out at the low end turns water into the gutter. Numbered legend with DFL rows and units; roofing and gutter are by others.</desc>
