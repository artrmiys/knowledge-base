<polygon points="139.9,180.0 158.6,180.0 164.2,176.8 145.5,176.8" fill="#eddff5" stroke="#8e24aa" stroke-width="1.6" stroke-linejoin="round" />
<polygon points="139.9,186.6 158.6,186.6 158.6,180.0 139.9,180.0" fill="#e8d5f2" stroke="#8e24aa" stroke-width="1.6" stroke-linejoin="round" />
<text class="lab" x="40" y="50" >Где это на доме</text>
<rect x="40" y="66" width="22" height="14" fill="#1e88e5" stroke="#1e88e5" stroke-width="1.2"/><text class="cap" x="70" y="78" >Eave</text>
<rect x="122.8" y="66" width="22" height="14" fill="#e65100" stroke="#e65100" stroke-width="1.2"/><text class="cap" x="152.8" y="78" >Rake</text>
<rect x="205.6" y="66" width="22" height="14" fill="#e8d5f2" stroke="#8e24aa" stroke-width="1.2"/><text class="cap" x="235.6" y="78" >Return</text>
<line class="lead" x1="292" y1="110" x2="155.274" y2="179.34"/>
<text class="lab2" x="300" y="108" >Return: угол, где</text>
<text class="note" x="300" y="126" >eave встречает rake</text>
<text class="lab" x="60" y="318" >Cornice (boxed) return</text>
<text class="note" x="60" y="338" >фасад фронтона, угол крупно</text>
