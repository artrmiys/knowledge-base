<polygon points="600.0,440.0 660.0,440.0 660.0,394.0 600.0,424.0" fill="#e8d5f2" stroke="#8e24aa" stroke-width="2.2" stroke-linejoin="round" />
<line x1="600" y1="424" x2="600" y2="440" stroke="#1e88e5" stroke-width="6"/><line class="lead" x1="150" y1="578" x2="185" y2="444"/>
<text class="lab2" x="60" y="592" >return box: soffit + fascia + crown</text>
<text class="mono" x="60" y="611" >Returns | 12" | LFT или pcs</text>
<text class="small" x="60" y="630" >rake кончается на return; eave до угла</text>
