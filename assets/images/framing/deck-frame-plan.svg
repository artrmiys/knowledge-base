<path d="M190,104 v12 h20 v-12" fill="none" stroke="#4d5861" stroke-width="2.5"/><path d="M290,104 v12 h20 v-12" fill="none" stroke="#4d5861" stroke-width="2.5"/><path d="M390,104 v12 h20 v-12" fill="none" stroke="#4d5861" stroke-width="2.5"/><path d="M490,104 v12 h20 v-12" fill="none" stroke="#4d5861" stroke-width="2.5"/><rect x="114" y="236" width="79" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="207" y="250" width="86" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="307" y="236" width="86" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="407" y="250" width="86" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="507" y="236" width="119" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="100" y="470" width="540" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6" />
<rect x="110" y="374" width="40" height="40" fill="url(#endgrain)" stroke="#6c4b2a" stroke-width="1.8" />
<path d="M110,374 l40,40 M150,374 l-40,40" stroke="#6c4b2a" stroke-width="1.2"/><rect x="350" y="374" width="40" height="40" fill="url(#endgrain)" stroke="#6c4b2a" stroke-width="1.8" />
<path d="M350,374 l40,40 M390,374 l-40,40" stroke="#6c4b2a" stroke-width="1.2"/><rect x="590" y="374" width="40" height="40" fill="url(#endgrain)" stroke="#6c4b2a" stroke-width="1.8" />
<path d="M590,374 l40,40 M630,374 l-40,40" stroke="#6c4b2a" stroke-width="1.2"/><circle cx="140" cy="97" r="3.5" fill="#4d5861"/><circle cx="200" cy="97" r="3.5" fill="#4d5861"/><circle cx="260" cy="97" r="3.5" fill="#4d5861"/><circle cx="320" cy="97" r="3.5" fill="#4d5861"/><circle cx="380" cy="97" r="3.5" fill="#4d5861"/><circle cx="440" cy="97" r="3.5" fill="#4d5861"/><circle cx="500" cy="97" r="3.5" fill="#4d5861"/><circle cx="560" cy="97" r="3.5" fill="#4d5861"/><circle class="numc" cx="84" cy="97" r="11"/><text class="numt" x="84" y="101.5">1</text>
