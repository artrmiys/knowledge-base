<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">Blocking at a spacing: pieces along the measured line</title>
  <desc id="d">Plan of floor joists with a measured line along a joist bay and a blocking piece at every 48 inches of the line. Below: flat blocking and diagonal bridging between two joists in section. Right: DFL row and formula.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="559" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="h" x="40" y="44">План: joists и Line вдоль зоны</text>
<rect x="60" y="120" width="440" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="60" y="190" width="440" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="60" y="260" width="440" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="60" y="330" width="440" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="48" y="120" width="12" height="222" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="124" y="202" width="12" height="58" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.5"/>
<rect x="224" y="202" width="12" height="58" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.5"/>
<rect x="324" y="202" width="12" height="58" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.5"/>
<rect x="424" y="202" width="12" height="58" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.5"/>
<line x1="70" y1="231" x2="490" y2="231" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 6"/>
<circle cx="130" cy="231" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<circle cx="230" cy="231" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<circle cx="330" cy="231" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<circle cx="430" cy="231" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<line x1="70" y1="92" x2="490" y2="92" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="280" y="82" text-anchor="middle">G = длина линии, LFT</text>
<line x1="230" y1="366" x2="330" y2="366" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="280" y="388" text-anchor="middle">H = 48"</text>
<circle cx="96" cy="231" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="96" y="235.5">1</text>
<circle cx="430" cy="174" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="430" y="178.5">2</text>
<line x1="430" y1="186" x2="430" y2="204" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="460" cy="336" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="460" y="340.5">3</text>
<line x1="40" y1="410" x2="520" y2="410" stroke="#dfe3e8" stroke-width="1.2"/>
<rect x="60" y="440" width="12" height="70" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="152" y="440" width="12" height="70" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="72" y="468" width="80" height="14" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.4"/>
<text class="lab2" x="180" y="470">Flat</text>
<text class="note" x="180" y="490">2' доски на точку</text>
<rect x="330" y="440" width="12" height="70" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="422" y="440" width="12" height="70" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<line x1="343" y1="444" x2="421" y2="506" stroke="#6c4b2a" stroke-width="6"/>
<line x1="343" y1="506" x2="421" y2="444" stroke="#6c4b2a" stroke-width="6"/>
<text class="lab2" x="450" y="470">Diagonal</text>
<text class="note" x="450" y="490">2.5' на точку</text>
<text class="side" x="60" y="540">сечение поперёк joists</text>
<circle cx="560" cy="60" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="560" y="64.5">1</text>
<text class="lab2" x="580" y="65">Line вдоль зоны</text>
<text class="mono2" x="580" y="83">details/blocking 48</text>
<text class="note" x="580" y="100">G строки = LFT линии</text>
<circle cx="560" cy="134" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="560" y="138.5">2</text>
<text class="lab2" x="580" y="139">Blocking: кусок на каждой точке</text>
<text class="mono2" x="580" y="157">Blocking Flat 48" o.c.</text>
<text class="mono2" x="580" y="174">2x10 | D 16</text>
<text class="note" x="580" y="191">B = сечение joists, H = 48</text>
<circle cx="560" cy="225" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="560" y="229.5">3</text>
<text class="lab2" x="580" y="230">Joists</text>
<text class="note" x="580" y="248">страница Joist</text>
<rect x="548" y="276" width="312" height="190" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="lab2" x="562" y="300">Формула C: доски по 16'</text>
<text class="mono" x="562" y="330">=CEILING(G*12/H*2/D,1)</text>
<text class="note" x="562" y="356">G*12/H = число точек на линии</text>
<text class="note" x="562" y="376">2 = ft доски на точку (flat);</text>
<text class="note" x="562" y="396">diagonal 2.5, vertical 1.5</text>
<text class="note" x="562" y="416">D = 16: длина доски</text>
<text class="ink" x="562" y="448">G 240: 60 точек x 2' / 16 = 8</text>
</svg>
