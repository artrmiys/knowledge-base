<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="t d">
  <title id="t">Rim board closes the joist ends around the floor perimeter</title>
  <desc id="d">Oblique view of a floor corner: double top plates, joists running back, rim board along the front edge closing the joist ends (cut away at the right to show the ends), second rim along the side. Inset: rim thickness options.</desc>
