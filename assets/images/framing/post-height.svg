<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-labelledby="t d">
  <title id="t">Post height: continuous post and story posts</title>
  <desc id="d">Left: one continuous post from the foundation through two floors to the roof beam, counted once with its full height. Right: separate story posts on each floor with cap and base, one point per floor, each with its own height from the base to the underside of the beam.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="659" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="h" x="40" y="44">Непрерывный пост: одна точка</text>
<text class="mono" x="40" y="68">framing/roof framing/posts/6x6 27</text>
<rect x="50" y="556" width="280" height="30" fill="url(#conc)" stroke="#6b7378" stroke-width="1.3"/>
<rect x="50" y="416" width="280" height="6" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1"/>
<rect x="50" y="422" width="280" height="26" fill="#f6ead3" stroke="#8a6a3f" stroke-width="1.1"/>
<text class="note" x="54" y="408">2nd floor</text>
<rect x="50" y="276" width="280" height="6" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1"/>
<rect x="50" y="282" width="280" height="26" fill="#f6ead3" stroke="#8a6a3f" stroke-width="1.1"/>
<text class="note" x="54" y="268">3rd floor</text>
<text class="note" x="54" y="548">1st floor</text>
<rect x="120" y="122" width="150" height="28" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<text class="note" x="280" y="140">roof beam</text>
<rect x="182" y="150" width="26" height="406" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<path d="M176,150 V162 H214 V150" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<path d="M176,556 V544 H214 V556" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<circle cx="195" cy="210" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
<text class="note" x="214" y="206">1 точка, на этаже,</text>
<text class="note" x="214" y="224">который пост держит</text>
<line x1="352" y1="150" x2="352" y2="556" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="lab" x="362" y="330">27 ft</text>
<text class="note" x="362" y="350">от базы</text>
<text class="note" x="362" y="368">до низа</text>
<text class="note" x="362" y="386">балки</text>
<text class="note" x="40" y="612">Один раз, на верхнем этаже; на нижних этажах дублей нет.</text>
<text class="note" x="40" y="632">Высота в имени = сумма этажей, которые пост проходит.</text>
<text class="h" x="470" y="44">Story posts: точка на каждом этаже</text>
<text class="note" x="470" y="68">только если detail показывает разрыв</text>
<rect x="470" y="556" width="250" height="30" fill="url(#conc)" stroke="#6b7378" stroke-width="1.3"/>
<rect x="470" y="416" width="250" height="6" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1"/>
<rect x="470" y="422" width="250" height="26" fill="#f6ead3" stroke="#8a6a3f" stroke-width="1.1"/>
<text class="note" x="474" y="408">2nd floor</text>
<rect x="492" y="448" width="146" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="470" y="276" width="250" height="6" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1"/>
<rect x="470" y="282" width="250" height="26" fill="#f6ead3" stroke="#8a6a3f" stroke-width="1.1"/>
<text class="note" x="474" y="268">3rd floor</text>
<rect x="492" y="308" width="146" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<text class="note" x="474" y="548">1st floor</text>
<rect x="492" y="122" width="146" height="28" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="552" y="466" width="26" height="90" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<path d="M546,466 V478 H584 V466" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<path d="M546,556 V544 H584 V556" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<circle cx="565" cy="511.0" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
<text class="mono" x="600" y="507.0">2nd floor framing/</text>
<text class="mono" x="600" y="525.0">posts/6x6 8.2</text>
<rect x="552" y="326" width="26" height="90" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<path d="M546,326 V338 H584 V326" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<path d="M546,416 V404 H584 V416" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<circle cx="565" cy="371.0" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
<text class="mono" x="600" y="367.0">3rd floor framing/</text>
<text class="mono" x="600" y="385.0">posts/6x6 8.2</text>
<rect x="552" y="150" width="26" height="126" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<path d="M546,150 V162 H584 V150" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<path d="M546,276 V264 H584 V276" fill="none" stroke="#4d5861" stroke-width="3" stroke-linejoin="round"/>
<circle cx="565" cy="213.0" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
<text class="mono" x="600" y="209.0">roof framing/</text>
<text class="mono" x="600" y="227.0">posts/6x6 8.2</text>
<line x1="740" y1="466" x2="740" y2="556" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="lab" x="752" y="500">8.2 ft</text>
<text class="note" x="752" y="520">до низа балки</text>
<line x1="740" y1="276" x2="740" y2="416" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="red" x="752" y="340">floor-to-floor</text>
<text class="red" x="752" y="358">не высота поста</text>
<text class="note" x="470" y="612">Cap и base на каждый пост. Story posts не склеивать</text>
<text class="note" x="470" y="632">в один без детали continuity; сомнение: verify.</text>
<line x1="440" y1="30" x2="440" y2="640" stroke="#dfe3e8" stroke-width="1.2"/>
</svg>
