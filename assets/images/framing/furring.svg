<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" role="img" aria-labelledby="t d">
  <title id="t">Furring: Z metal furring on CMU and wood furring under siding</title>
  <desc id="d">Two plan sections. (a) CMU wall, rigid insulation with Z metal furring, gypsum. (b) Stud wall, sheathing, WRB, 1x4 P.T. furring strips, siding. Numbered legend with DFL rows.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="629" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="h" x="40" y="40">(a) CMU + Z metal furring</text>
<text class="note" x="480" y="44" text-anchor="end">план-сечение</text>
<rect x="40" y="70" width="440" height="70" fill="url(#cmu)" stroke="#6b7378" stroke-width="1.4"/>
<rect x="40" y="140" width="440" height="24" fill="url(#rigid)" stroke="#d9a441" stroke-width="1.2"/>
<path d="M98,143 H120 V161 H142" fill="none" stroke="#4d5861" stroke-width="3.2" stroke-linejoin="round"/>
<path d="M258,143 H280 V161 H302" fill="none" stroke="#4d5861" stroke-width="3.2" stroke-linejoin="round"/>
<path d="M418,143 H440 V161 H462" fill="none" stroke="#4d5861" stroke-width="3.2" stroke-linejoin="round"/>
<rect x="40" y="164" width="440" height="9" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.2"/>
<line x1="280" y1="196" x2="440" y2="196" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="360.0" y="189.0" text-anchor="middle">24" o.c.</text>
<text class="side" x="40" y="196">INT</text>
<text class="side" x="480" y="62" text-anchor="end">CMU / CONCRETE</text>
<circle cx="200" cy="105" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="200" y="109.5">1</text>
<circle cx="120" cy="152" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="120" y="156.5">2</text>
<circle cx="360" cy="152" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="360" y="156.5">3</text>
<circle cx="60" cy="168" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="60" y="172.5">4</text>
<circle cx="540" cy="76" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="80.5">1</text>
<text class="lab2" x="560" y="81">CMU wall</text>
<text class="red" x="560" y="99">by others, не считаем</text>
<circle cx="540" cy="124" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="128.5">2</text>
<text class="lab2" x="560" y="129">Z furring (metal) @ 24" o.c.</text>
<text class="mono2" x="560" y="147">Furring | Z furring | LFT</text>
<circle cx="540" cy="172" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="176.5">3</text>
<text class="lab2" x="560" y="177">Rigid insulation 1-1/2"</text>
<text class="mono2" x="560" y="195">Insulation at CMU | SQ FT</text>
<circle cx="540" cy="220" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="224.5">4</text>
<text class="lab2" x="560" y="225">Gypsum</text>
<text class="red" x="560" y="243">by others, не считаем</text>
<text class="note" x="40" y="232">Клиент может не хотеть видеть metal:</text>
<text class="note" x="40" y="251">проверь scope перед выводом Z furring.</text>
<text class="h" x="40" y="312">(b) Furring под siding</text>
<text class="note" x="480" y="316" text-anchor="end">план-сечение</text>
<rect x="40" y="342" width="440" height="11" fill="#d7c3a6" stroke="#8a6a3f" stroke-width="1.2"/>
<rect x="80" y="353" width="44" height="12" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.2"/>
<rect x="240" y="353" width="44" height="12" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.2"/>
<rect x="400" y="353" width="44" height="12" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.2"/>
<line x1="40" y1="366.5" x2="480" y2="366.5" stroke="#2e7d32" stroke-width="2.4"/>
<rect x="40" y="368" width="440" height="11" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<rect x="40" y="379" width="440" height="66" fill="url(#batt)" stroke="#caa64a" stroke-width="1"/>
<rect x="93" y="379" width="18" height="66" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="253" y="379" width="18" height="66" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="413" y="379" width="18" height="66" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="40" y="445" width="440" height="9" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.2"/>
<line x1="102" y1="476" x2="262" y2="476" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="182.0" y="469.0" text-anchor="middle">16" o.c.</text>
<text class="side" x="40" y="476">INT</text>
<text class="side" x="480" y="334" text-anchor="end">EXT</text>
<circle cx="180" cy="347" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="180" y="351.5">1</text>
<circle cx="422" cy="359" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="422" y="363.5">2</text>
<circle cx="330" cy="366" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="330" y="370.5">3</text>
<circle cx="180" cy="373" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="180" y="377.5">4</text>
<circle cx="262" cy="412" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="262" y="416.5">5</text>
<circle cx="60" cy="449" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="60" y="453.5">6</text>
<circle cx="540" cy="348" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="352.5">1</text>
<text class="lab2" x="560" y="353">Siding</text>
<text class="note" x="560" y="371">страница Siding</text>
<circle cx="540" cy="388" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="392.5">2</text>
<text class="lab2" x="560" y="393">Furring 1x4 P.T. @ 16" o.c.</text>
<text class="mono2" x="560" y="411">Furring | 1x4 P.T. | LFT</text>
<circle cx="540" cy="428" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="432.5">3</text>
<text class="lab2" x="560" y="433">WRB</text>
<text class="note" x="560" y="451">продукт из спецификации</text>
<circle cx="540" cy="468" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="472.5">4</text>
<text class="lab2" x="560" y="473">Sheathing</text>
<text class="note" x="560" y="491">страница Wall Sheathing</text>
<circle cx="540" cy="508" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="512.5">5</text>
<text class="lab2" x="560" y="513">Studs 2x6 + batt</text>
<text class="note" x="560" y="531">стена; batt не считаем</text>
<circle cx="540" cy="548" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="552.5">6</text>
<text class="lab2" x="560" y="553">Gypsum</text>
<text class="red" x="560" y="571">by others, не считаем</text>
<text class="note" x="40" y="520">P.T. у фундамента и во влажных зонах, выше обычно</text>
<text class="note" x="40" y="539">не P.T.: это разные строки.</text>
<text class="note" x="40" y="558">Не добавляй 2x4 furring на CMU, если detail просит</text>
<text class="note" x="40" y="577">только insulation.</text>
</svg>
