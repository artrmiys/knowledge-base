<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d">
  <title id="t">Structural screws along a ledger</title>
  <desc id="d">Elevation of a ledger board on a wall with groups of three structural screws every 16 inches, a side section of one group, and the row of the list that counts them.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
