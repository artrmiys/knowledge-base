<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img" aria-labelledby="t d">
  <title id="t">Wall bracing and drywall backing are two different rows</title>
  <desc id="d">Left: section of a stud wall with a diagonal 2x4 brace; the row Bracing Ext Walls counts pieces, one board per 8 LFT of wall, stock length by wall height. Right: wall parallel to the joists with a flat backing board on the top plate that carries the edge of the ceiling gypsum; the row is Blocking for Drywall.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="639" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="h" x="40" y="46">(a) Bracing стен</text>
<line x1="50" y1="340" x2="410" y2="340" stroke="#3a3f44" stroke-width="1.4"/>
<rect x="300" y="110" width="34" height="10" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="300" y="120" width="34" height="10" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="300" y="130" width="34" height="200" fill="#e9d3b0" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="300" y="330" width="34" height="10" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<polygon points="300,150 300,164 124,340 110,340" fill="url(#wood)" stroke="#2e7d32" stroke-width="2.4" stroke-linejoin="round"/>
<rect x="96" y="330" width="34" height="10" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<line x1="366" y1="110" x2="366" y2="340" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="376" y="222">wall</text>
<text class="dimt" x="376" y="240">height</text>
<circle cx="205" cy="248" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="205" y="252.5">1</text>
<text class="mono2" x="40" y="374">Bracing Ext Walls | 2x4 | штуки</text>
<text class="ink" x="40" y="396">C = G / 8 x 1.1: одна доска на 8 LFT стены</text>
<text class="ink" x="40" y="418">D = длина доски по самой высокой стене типа:</text>
<rect x="40" y="432" width="150" height="22" fill="#f2f3f5" stroke="#3a3f44" stroke-width="0.6"/>
<text class="xlh" x="115.0" y="448" text-anchor="middle">Высота стены</text>
<rect x="190" y="432" width="70" height="22" fill="#f2f3f5" stroke="#3a3f44" stroke-width="0.6"/>
<text class="xlh" x="225.0" y="448" text-anchor="middle">D</text>
<rect x="40" y="454" width="150" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<rect x="190" y="454" width="70" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<text class="xl" x="46" y="471.0">до 10'</text>
<text class="xl" x="225.0" y="471.0" text-anchor="middle">14</text>
<rect x="40" y="478" width="150" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<rect x="190" y="478" width="70" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<text class="xl" x="46" y="495.0">до 12'</text>
<text class="xl" x="225.0" y="495.0" text-anchor="middle">16</text>
<rect x="40" y="502" width="150" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<rect x="190" y="502" width="70" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<text class="xl" x="46" y="519.0">до 16'</text>
<text class="xl" x="225.0" y="519.0" text-anchor="middle">18</text>
<rect x="40" y="526" width="150" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<rect x="190" y="526" width="70" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.7"/>
<text class="xl" x="46" y="543.0">выше 16'</text>
<text class="xl" x="225.0" y="543.0" text-anchor="middle">20</text>
<text class="ink" x="280" y="470">Так же:</text>
<text class="mono2" x="280" y="490">Bracing Corridor</text>
<text class="mono2" x="280" y="510">Bracing Demising</text>
<line x1="440" y1="30" x2="440" y2="560" stroke="#dfe3e8" stroke-width="1.2"/>
<text class="h" x="470" y="46">(b) Опора гипса у стены вдоль joists</text>
<rect x="500" y="96" width="14" height="80" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="580" y="96" width="14" height="80" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="740" y="96" width="14" height="80" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="820" y="96" width="14" height="80" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="482" y="176" width="160" height="8" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<rect x="698" y="176" width="160" height="8" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<rect x="650" y="176" width="40" height="10" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="650" y="186" width="40" height="10" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="650" y="196" width="40" height="134" fill="#e9d3b0" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="642" y="184" width="8" height="146" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<rect x="690" y="184" width="8" height="146" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<path d="M636,330 l8,-4 l10,8 l10,-8 l10,8 l10,-8 l10,8 l8,-4" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<rect x="626" y="164" width="88" height="12" fill="url(#wood)" stroke="#2e7d32" stroke-width="2.4"/>
<text class="note" x="540" y="84" text-anchor="middle">joists</text>
<text class="note" x="780" y="84" text-anchor="middle">joists</text>
<text class="note" x="560" y="208" text-anchor="middle">ceiling gypsum</text>
<text class="note" x="790" y="208" text-anchor="middle">by others</text>
<circle cx="670" cy="150" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="670" y="154.5">2</text>
<text class="mono2" x="470" y="374">Blocking for Drywall | 2x4 | D 16</text>
<text class="ink" x="470" y="396">C = CEILING(G / D, 1), доски по 16'</text>
<text class="ink" x="470" y="418">G = LFT стен, параллельных joists или фермам.</text>
<text class="ink" x="470" y="440">Строка живёт в Floor Framing List.</text>
<text class="ink" x="470" y="462">Demising: с обеих сторон; наружная: с одной.</text>
<text class="ink" x="470" y="484">На panel-job считается всегда: в панель не входит.</text>
<rect x="40" y="574" width="800" height="48" fill="#fdf1f1" stroke="#efc4c4" stroke-width="1.2" rx="8"/>
<circle cx="62" cy="598" r="10" fill="#c62828"/><path d="M58,594 L66,602 M66,594 L58,602" fill="none" stroke="#fff" stroke-width="2.2"/>
<text class="ink" x="82" y="603">Строки Bracing for Drywall в DFL нет. Bracing стен и опора гипса: две разные строки.</text>
</svg>
