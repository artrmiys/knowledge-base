<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-labelledby="t d">
  <title id="t">Sill plate anchor bolts into concrete</title>
  <desc id="d">Section along a wall on concrete: P.T. sill plate on sill seal, cast-in J-bolts with washer and nut at the schedule spacing, embedment dimension. Inset: a screw anchor such as Titen HD has a head and washer but no nut.</desc>
