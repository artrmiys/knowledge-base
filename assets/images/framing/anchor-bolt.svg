<text class="lab2" x="560" y="112">Anchor bolt</text>
<text class="mono2" x="560" y="130">Anchor Bolts 36" o.c.</text>
<text class="mono2" x="560" y="147">1/2" Ø emb. | pcs</text>
<text class="note" x="560" y="164">размер, emb, шаг и продукт:</text>
<text class="note" x="560" y="181">anchorage schedule, SW schedule;</text>
<text class="note" x="560" y="198">пусто: 1/2" @ 36" o.c. и assumed</text>
<circle cx="540" cy="232" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="236.5">3</text>
