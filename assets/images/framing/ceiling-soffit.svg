<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">Dropped interior soffit framing</title>
  <desc id="d">Section of a dropped soffit box under the floor joists along a wall: plates at the ceiling, at the wall and at the bottom corner, vertical and horizontal frame members, gypsum by others. Below: the same box on the RCP with the perimeter line for plates and the area for the frame.</desc>
