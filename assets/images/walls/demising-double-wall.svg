<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 656" role="img" aria-labelledby="t d">
  <title id="t">Double demising wall: section and how it is measured</title>
  <desc id="d">Section through a double demising wall at a floor: two 2x4 frames with a gap, gypsum both sides, draft stop in the floor depth, solid blocking, joists of each unit. Plan inset: one Line along the wall axis named dem (2) 2x4 9.09.</desc>
