<text class="red" x="60" y="545" >не считаем во frame-scope</text>
<text class="note" x="60" y="56" >Каждый каркас - своя линия в дереве и свои строки DFL: studs, plates, blocking.</text>
<text class="note" x="60" y="76" >Двойная стена = два каркаса только если на плане два каркаса.</text>
