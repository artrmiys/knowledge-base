<line class="lead" x1="628" y1="262" x2="416" y2="262"/>
<text class="lab" x="640" y="258" >Draft stop 1/2" OSB</text>
<text class="mono" x="640" y="277" >Draft Stop | 1/2" OSB | SQ FT</text>
<text class="small" x="640" y="295" >в перекрытии над стеной, по всей длине</text>
<line class="lead" x1="628" y1="340" x2="446" y2="300"/>
<text class="lab2" x="640" y="336" >Solid blocking у концов joists</text>
<text class="mono" x="640" y="355" >Blocking | 2x10 | LFT (на каждой стене)</text>
<line class="lead" x1="628" y1="410" x2="560" y2="300"/>
<text class="note" x="640" y="406" >Joists каждого юнита на своей стене</text>
<line class="lead" x1="330" y1="400" x2="378" y2="400"/>
<text class="lab" x="60" y="396" >Два каркаса 2x4, зазор 1"</text>
<text class="mono" x="60" y="415" >dem 2x4 9.09 (x2) | Line на каждый</text>
<line class="lead" x1="330" y1="470" x2="372" y2="470"/>
<text class="lab2" x="60" y="466" >Gypsum 2 слоя с каждой стороны</text>
<text class="red" x="60" y="485" >by others, не считаем</text>
<line class="lead" x1="330" y1="530" x2="394" y2="530"/>
