<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="t d">
  <title id="t">Routing layers: how OurPlanCore decides where a new takeoff lands</title>
  <desc id="d">Five numbered rules checked top down, the first match wins: U sheet to units; takeoff name or tool routing; sheet dot W, F or S with the tool; building root; old word parsing without a dot. Record ignores all of them.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#2e7d32"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="gyp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#eef0f2"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    
    <style>
      .ln{fill:none;stroke:#3a3f44;stroke-width:1.6;stroke-linejoin:round}
      .thin{fill:none;stroke:#3a3f44;stroke-width:1.1}
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .small{font:400 12.5px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 13px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .lead{stroke:#2e7d32;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .leadInk{stroke:#3a3f44;stroke-width:1.3;fill:none;marker-end:url(#arrInk)}
      .leadRed{stroke:#c62828;stroke-width:1.5;fill:none;marker-end:url(#arrRed)}
      .dim{stroke:#3a3f44;stroke-width:1.1;fill:none;marker-start:url(#tick);marker-end:url(#tick)}
      .dimt{font:500 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numc{fill:#2e7d32;stroke:#fff;stroke-width:1.5}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .h{font:700 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .cap{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="689" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="lab" x="40" y="46" >Проверка сверху вниз: первое сработавшее правило выигрывает</text>
<rect x="40" y="76" width="660" height="86" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="102" r="15" fill="#2e7d32"/><text x="66" y="108" text-anchor="middle" style="font:700 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#fff">1</text><text class="lab" x="92" y="107" style="font-size:18px">Лист с точкой U</text>
<text class="note" x="92" y="129" >любой инструмент</text>
<text class="mono2" x="92" y="150" fill="#2e7d32">идёт в: units</text>
<text class="small" x="720" y="107" >правила по имени на U-листе не</text>
<text class="small" x="720" y="124" >действуют</text>
<line x1="370" y1="162" x2="370" y2="176" stroke="#3a3f44" stroke-width="2" marker-end="url(#arrInk)"/><text class="small" x="382" y="174" >не сработало, дальше</text>
<rect x="40" y="178" width="660" height="86" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="204" r="15" fill="#2e7d32"/><text x="66" y="210" text-anchor="middle" style="font:700 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#fff">2</text><text class="lab" x="92" y="209" style="font-size:18px">Takeoff Name Routing</text>
<text class="note" x="92" y="231" >слово в имени (eve, rake, gable, prpt, trussheel) или инструмент Openings</text>
<text class="mono2" x="92" y="252" fill="#2e7d32">идёт в: eves rakes, gables, parapets, trussheel, openings</text>
<text class="small" x="720" y="209" >сильнее точки листа: eve 24 main с</text>
<text class="small" x="720" y="226" >W-листа уйдёт в eves rakes/eves</text>
<line x1="370" y1="264" x2="370" y2="278" stroke="#3a3f44" stroke-width="2" marker-end="url(#arrInk)"/><text class="small" x="382" y="276" >не сработало, дальше</text>
<rect x="40" y="280" width="660" height="86" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="306" r="15" fill="#2e7d32"/><text x="66" y="312" text-anchor="middle" style="font:700 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#fff">3</text><text class="lab" x="92" y="311" style="font-size:18px">Точка листа W / F / S + инструмент</text>
<text class="note" x="92" y="333" >Line, Count, Area, J Area, Beam</text>
<text class="mono2" x="92" y="354" fill="#2e7d32">идёт в: walls, sqfts, framing/..., shear walls/...</text>
<text class="small" x="720" y="311" >таблица Tool destinations в</text>
<text class="small" x="720" y="328" >Settings</text>
<line x1="370" y1="366" x2="370" y2="380" stroke="#3a3f44" stroke-width="2" marker-end="url(#arrInk)"/><text class="small" x="382" y="378" >не сработало, дальше</text>
<rect x="40" y="382" width="660" height="86" rx="10" fill="#eceff2" stroke="#6b7378" stroke-width="2"/><circle cx="66" cy="408" r="15" fill="#6b7378"/><text x="66" y="414" text-anchor="middle" style="font:700 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#fff">4</text><text class="lab" x="92" y="413" style="font-size:18px">Корпус</text>
<text class="note" x="92" y="435" >папка с зелёной точкой; иначе Building root из настроек; иначе корень Takeoffs</text>
<text class="mono2" x="92" y="456" fill="#2e7d32">идёт в: &lt;корпус&gt;/...</text>
<line x1="370" y1="468" x2="370" y2="482" stroke="#3a3f44" stroke-width="2" marker-end="url(#arrInk)"/><text class="small" x="382" y="480" >не сработало, дальше</text>
<rect x="40" y="484" width="660" height="86" rx="10" fill="#eceff2" stroke="#6b7378" stroke-width="2"/><circle cx="66" cy="510" r="15" fill="#6b7378"/><text x="66" y="516" text-anchor="middle" style="font:700 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#fff">5</text><text class="lab" x="92" y="515" style="font-size:18px">Лист без точки и без правила</text>
<text class="note" x="92" y="537" >старый разбор имени по словам (sqfts, walls)</text>
<text class="mono2" x="92" y="558" fill="#2e7d32">идёт в: запасной путь</text>
<text class="small" x="720" y="515" >редактора у него нет</text>
<rect x="40" y="590" width="660" height="62" rx="10" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/><text class="note" x="60" y="616" fill="#c62828">Record (Space) продолжает выбранный takeoff и маршрут не считает.</text>
<text class="note" x="60" y="638" fill="#c62828">Существующие takeoff при смене точки или правил не переезжают.</text>
<text class="small" x="720" y="616" >Предпросмотр назначения виден</text>
<text class="small" x="720" y="632" >в диалоге New Item до создания.</text>
<text class="mono2" x="720" y="660" >Status bar: Route: W 2nd</text>
</svg>
