<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" role="img" aria-labelledby="t d">
  <title id="t">Routing layers: which rule decides where a new takeoff goes</title>
  <desc id="d">Five checks from top to bottom, the first that fires wins: U sheet, Takeoff Name Routing, sheet dot W F S with the tool, building, sheet without a dot. A dashed note below: Record continues the selected takeoff and does not route; existing takeoffs do not move.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="759" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="h" x="30" y="40">Проверка сверху вниз: первое сработавшее правило выигрывает</text>
<rect x="30" y="62" width="600" height="92" fill="#dff2df" stroke="#2e7d32" stroke-width="1.8" rx="10"/>
<circle cx="60" cy="92" r="15" fill="#2e7d32"/><text x="60" y="98" text-anchor="middle" style="font:700 17px Inter, Segoe UI, Arial, sans-serif" fill="#fff">1</text>
<text class="h" x="86" y="98">Лист с точкой U</text>
<text class="note" x="86" y="121" style="fill:#2e7d32">любой инструмент</text>
<text class="mono2" x="86" y="142">идёт в: units</text>
<text class="note" x="646" y="92">правила по имени</text>
<text class="note" x="646" y="111">на U-листе не действуют</text>
<line x1="330.0" y1="155" x2="330.0" y2="185" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<text class="note" x="342.0" y="175.0">не сработало, дальше</text>
<rect x="30" y="186" width="600" height="92" fill="#dff2df" stroke="#2e7d32" stroke-width="1.8" rx="10"/>
<circle cx="60" cy="216" r="15" fill="#2e7d32"/><text x="60" y="222" text-anchor="middle" style="font:700 17px Inter, Segoe UI, Arial, sans-serif" fill="#fff">2</text>
<text class="h" x="86" y="222">Takeoff Name Routing</text>
<text class="note" x="86" y="245" style="fill:#2e7d32">имя с eve, rake, gable, prpt, trussheel или инструмент Openings</text>
<text class="mono2" x="86" y="266">идёт в: eves rakes, gables, parapets, trussheel, openings</text>
<text class="note" x="646" y="210">сильнее точки листа:</text>
<text class="note" x="646" y="229">eve 24 main с W-листа</text>
<text class="note" x="646" y="248">уйдёт в eves rakes/eves</text>
<line x1="330.0" y1="279" x2="330.0" y2="309" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<text class="note" x="342.0" y="299.0">не сработало, дальше</text>
<rect x="30" y="310" width="600" height="92" fill="#dff2df" stroke="#2e7d32" stroke-width="1.8" rx="10"/>
<circle cx="60" cy="340" r="15" fill="#2e7d32"/><text x="60" y="346" text-anchor="middle" style="font:700 17px Inter, Segoe UI, Arial, sans-serif" fill="#fff">3</text>
<text class="h" x="86" y="346">Точка листа W / F / S + инструмент</text>
<text class="note" x="86" y="369" style="fill:#2e7d32">Line, Count, Area, J Area, Beam</text>
<text class="mono2" x="86" y="390">идёт в: walls, sqfts, framing/..., shear walls/...</text>
<text class="note" x="646" y="340">таблица Tool destinations</text>
<text class="note" x="646" y="359">в Settings</text>
<line x1="330.0" y1="403" x2="330.0" y2="433" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<text class="note" x="342.0" y="423.0">не сработало, дальше</text>
<rect x="30" y="434" width="600" height="92" fill="#e9ecef" stroke="#6b7378" stroke-width="1.8" rx="10"/>
<circle cx="60" cy="464" r="15" fill="#6b7378"/><text x="60" y="470" text-anchor="middle" style="font:700 17px Inter, Segoe UI, Arial, sans-serif" fill="#fff">4</text>
<text class="h" x="86" y="470">Корпус</text>
<text class="note" x="86" y="493">папка с зелёной точкой, иначе Building root, иначе корень Takeoffs</text>
<text class="mono2" x="86" y="514">идёт в: &lt;корпус&gt;/...</text>
<line x1="330.0" y1="527" x2="330.0" y2="557" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<text class="note" x="342.0" y="547.0">не сработало, дальше</text>
<rect x="30" y="558" width="600" height="92" fill="#e9ecef" stroke="#6b7378" stroke-width="1.8" rx="10"/>
<circle cx="60" cy="588" r="15" fill="#6b7378"/><text x="60" y="594" text-anchor="middle" style="font:700 17px Inter, Segoe UI, Arial, sans-serif" fill="#fff">5</text>
<text class="h" x="86" y="594">Лист без точки и без правила</text>
<text class="note" x="86" y="617">старый разбор имени по словам (sqfts, walls)</text>
<text class="mono2" x="86" y="638">идёт в: запасной путь</text>
<text class="note" x="646" y="588">редактора у него нет</text>
<rect x="30" y="674" width="600" height="70" fill="#fff" stroke="#c62828" stroke-width="1.6" rx="10" stroke-dasharray="7 5"/>
<text class="ink" x="48" y="703">Record (Space) продолжает выбранный takeoff и маршрут не считает.</text>
<text class="ink" x="48" y="725">Существующие takeoff при смене точки или правил не переезжают.</text>
<text class="note" x="646" y="694">Назначение видно до</text>
<text class="note" x="646" y="713">создания: диалог New Item</text>
<text class="mono2" x="646" y="736">Status bar: Route: W 2nd</text>
</svg>
