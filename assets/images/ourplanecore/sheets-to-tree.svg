<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" role="img" aria-labelledby="t d">
  <title id="t">One floor, four sheets with dots, four branches of the takeoff tree</title>
  <desc id="d">Left: one floor plan of the set. Middle: four working sheets, each a plan copy with its dot W, F, S or U. Right: the tree of one building; coloured lines lead from each sheet to its branches: W to walls, sqfts and openings, F to framing, S to shear walls, U to units.</desc>
