<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Что двигается в Adobe Acrobat после экспорта OurPlanCore</title>
  <desc id="desc">Линии, площади и подписи двигаются мышью. Точки Count и площади joists не двигаются. Легенда того же типа, что точки, отдельно её не пробовали. Adobe не пересчитывает подписи и легенду.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="900" height="470" rx="12" fill="#f5f7f5"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#183323">
    <text x="30" y="38" font-size="22" font-weight="600">Что двигается в Adobe Acrobat</text>

    <text x="30" y="74" font-size="16" font-weight="600" fill="#2e7d32">Двигаются мышью</text>
    <g fill="#fff" stroke="#2e7d32" stroke-width="2">
      <rect x="30" y="86" width="270" height="130" rx="8"/>
      <rect x="315" y="86" width="270" height="130" rx="8"/>
      <rect x="600" y="86" width="270" height="130" rx="8"/>
    </g>

    <!-- line: old place dotted, new place solid -->
    <path d="M58 130H150V174" fill="none" stroke="#9aa4a0" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M118 112H210V156" fill="none" stroke="#c62828" stroke-width="4"/>
    <path d="M86 146L112 124" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="204" font-size="16" font-weight="600">Линии, Line</text>

    <!-- area -->
    <rect x="345" y="122" width="96" height="52" fill="#d6e8f7" stroke="#9aa4a0" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="405" y="106" width="96" height="52" fill="#b6d6f0" stroke="#1565c0" stroke-width="3"/>
    <path d="M372 148L398 128" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="333" y="204" font-size="16" font-weight="600">Площади, Area</text>

    <!-- label -->
    <rect x="628" y="136" width="96" height="30" rx="3" fill="#fff" stroke="#9aa4a0" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="644" y="157" font-size="15" fill="#6b7378">120.5 LF</text>
    <rect x="714" y="102" width="96" height="30" rx="3" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    <text x="730" y="123" font-size="15" font-weight="600">120.5 LF</text>
    <path d="M676 136L708 122" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="618" y="204" font-size="16" font-weight="600">Подписи, отдельно от линии</text>

    <text x="30" y="246" font-size="16" font-weight="600" fill="#b45309">Не двигаются</text>
    <g fill="#fff" stroke="#d6ae5c" stroke-width="2">
      <rect x="30" y="258" width="270" height="110" rx="8"/>
      <rect x="315" y="258" width="270" height="110" rx="8"/>
      <rect x="600" y="258" width="270" height="110" rx="8" stroke-dasharray="7 5"/>
    </g>

    <!-- count -->
    <g fill="#1565c0">
      <circle cx="90" cy="296" r="9"/><circle cx="150" cy="296" r="9"/><circle cx="210" cy="296" r="9"/>
    </g>
    <text x="48" y="350" font-size="16" font-weight="600">Точки, Count и Beam</text>

    <!-- joist area -->
    <rect x="345" y="276" width="160" height="50" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="1.5">
      <path d="M365 276V326M385 276V326M405 276V326M425 276V326M445 276V326M465 276V326M485 276V326"/>
    </g>
    <text x="333" y="350" font-size="16" font-weight="600">Площади joists, J Area</text>

    <!-- legend -->
    <rect x="628" y="272" width="110" height="60" rx="3" fill="#fff" stroke="#6b7378" stroke-width="1.5"/>
    <g font-size="11" fill="#183323">
      <rect x="636" y="281" width="14" height="6" fill="#c62828"/><text x="656" y="288">ext 2x6</text>
      <rect x="636" y="298" width="14" height="6" fill="#1565c0"/><text x="656" y="305">1st</text>
      <circle cx="643" cy="319" r="4" fill="#1565c0"/><text x="656" y="323">post</text>
    </g>
    <text x="748" y="290" font-size="14">Тот же тип,</text>
    <text x="748" y="310" font-size="14">что у Count,</text>
    <text x="748" y="330" font-size="14">не пробовали</text>
    <text x="618" y="350" font-size="16" font-weight="600">Легенда</text>

    <rect x="30" y="384" width="840" height="66" rx="8" fill="#fff4dc" stroke="#d6ae5c"/>
    <text x="50" y="410" font-size="18" font-weight="600">Adobe не пересчитывает подписи и легенду</text>
    <text x="50" y="436" font-size="16">Изменилось количество: поправьте замер в OurPlanCore и экспортируйте заново.</text>
  </g>
</svg>
