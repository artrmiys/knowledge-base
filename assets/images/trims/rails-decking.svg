<line x1="110" y1="328" x2="430" y2="328" stroke="#b7a585" stroke-width="1"/>
<polyline points="103,94 103,337 437,337 437,94" fill="none" stroke="#8a98a5" stroke-width="4" stroke-linejoin="round"/>
<polyline points="118,94 118,322 422,322 422,94" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linejoin="round"/>
<rect x="110" y="314" width="16" height="16" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<rect x="414" y="314" width="16" height="16" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<line x1="110" y1="372" x2="430" y2="372" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="270" y="394" text-anchor="middle">W: фронт</text>
<line x1="470" y1="94" x2="470" y2="330" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="480" y="206">D:</text>
<text class="dimt" x="480" y="224">бок</text>
<circle cx="270" cy="200" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="270" y="204.5">1</text>
<circle cx="118" cy="294" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="118" y="298.5">2</text>
<circle cx="422" cy="294" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="422" y="298.5">2</text>
<circle cx="270" cy="322" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="270" y="326.5">3</text>
<circle cx="118" cy="180" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="118" y="184.5">3</text>
<circle cx="422" cy="180" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="422" y="184.5">3</text>
<circle cx="350" cy="337" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="350" y="341.5">4</text>
<circle cx="180" cy="77" r="11" fill="#6b7378" stroke="#fff" stroke-width="1.5"/><text class="numt" x="180" y="81.5">5</text>
<circle cx="540" cy="50" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="54.5">1</text>
<text class="lab2" x="560" y="55">Decking</text>
<text class="mono2" x="560" y="73">2x6 DuxxBak | SQ FT</text>
<text class="mono2" x="560" y="90">=CEILING(W*D*units*1.1,10)</text>
<circle cx="540" cy="120" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="124.5">2</text>
<text class="lab2" x="560" y="125">Posts at Rails</text>
<text class="mono2" x="560" y="143">4x4 P.T. | pcs</text>
<text class="note" x="560" y="160">2 на балкон: =2*G; Post Sleeve</text>
<text class="note" x="560" y="177">и Post Cap по числу постов</text>
<circle cx="540" cy="207" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="211.5">3</text>
<text class="lab2" x="560" y="212">Rail sections (composite)</text>
<text class="mono2" x="560" y="230">8' Rail section | unit</text>
<text class="note" x="560" y="247">секция на пролёт между постами;</text>
<text class="note" x="560" y="264">строка на каждую длину, в E</text>
<text class="note" x="560" y="281">сторона и размер: front 7'-4"</text>
<circle cx="540" cy="311" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="315.5">4</text>
<text class="lab2" x="560" y="316">Deck Fascia</text>
<text class="mono2" x="560" y="334">1x10 | LFT</text>
<text class="note" x="560" y="351">по открытому периметру</text>
<circle cx="540" cy="381" r="11" fill="#6b7378" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="385.5">5</text>
<text class="lab2" x="560" y="386">Сторона у стены</text>
<text class="note" x="560" y="404">перил нет; flashing на странице</text>
<text class="note" x="560" y="421">Balcony build-up</text>
<text class="note" x="50" y="440">Composite и Azek считаются системой (посты, sleeve, cap, секции).</text>
<text class="note" x="50" y="461">Wood painted поэлементно: Balustrades pcs, Rails (top &amp; bottom) и</text>
<text class="note" x="50" y="482">Cap Rail в LFT. Aluminum и metal by others: только нота.</text>
<text class="note" x="50" y="503">Продукт и высоту в имя замера не писать, они живут в DFL.</text>
</svg>
