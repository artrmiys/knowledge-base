<text class="lab2" x="605" y="291">Door: 3 стороны, 2 лица стены</text>
<text class="mono2" x="605" y="309">Casing for Int. Doors | LFT</text>
<circle cx="585" cy="342" r="11" fill="#7d8791" stroke="#fff" stroke-width="1.5"/><text class="numt" x="585" y="346.5">6</text>
<text class="lab2" x="605" y="347">Jamb двери</text>
<text class="note" x="605" y="365">не LFT-строка: двери точками,</text>
<text class="note" x="605" y="382">группа по сечению стены</text>
<rect x="40" y="410" width="800" height="124" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="lab2" x="56" y="436">Строки и формула</text>
<text class="mono2" x="56" y="460">Casing for Int. Doors | LFT</text>
<text class="mono2" x="330" y="460">Casing for Ext. Doors&amp;Wind | LFT</text>
<text class="mono" x="56" y="486">LFT = (W + 2H) x 2 лица стены x qty x 1.1, округлить до 10</text>
<text class="ink" x="56" y="512">24 двери 2668: периметр 30 + 2 x 80 = 190";  2 x 24 x 190 / 12 x 1.1 = 836, пишем 840 LFT</text>
</svg>
