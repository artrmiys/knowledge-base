<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d">
  <title id="t">Porch header trims in section: fascia and soffit trims at the header, crowns, frieze, beadboard soffit, column wrap</title>
  <desc id="d">Section through a porch roof edge: built-up header on a wrapped column, porch roof sloping to the house wall, beadboard soffit ceiling, fascia trim outside and inside the header, soffit trim under the header, crowns, frieze and fascia trim at the house wall. Callouts give DFL rows and units.</desc>
