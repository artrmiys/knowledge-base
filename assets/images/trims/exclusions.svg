<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
  <title id="t">Vinyl siding meets cladding by others: what is ours</title>
  <desc id="d">Plan section of an exterior wall where vinyl siding meets stone veneer or EIFS by others. Ours: sheathing, WRB, furring, vinyl siding, J-channel at the siding edge, wood or PVC trim. By others: veneer or EIFS with its lath, base coat and casing bead.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="599" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="side" x="40" y="60">EXT</text>
<text class="side" x="40" y="326">INT</text>
<rect x="40" y="230" width="440" height="62" fill="url(#batt)" stroke="#caa64a" stroke-width="1"/>
<rect x="60" y="230" width="18" height="62" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="208" y="230" width="18" height="62" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="356" y="230" width="18" height="62" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="440" y="230" width="18" height="62" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="40" y="292" width="440" height="10" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.2"/>
<rect x="40" y="214" width="440" height="16" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<line x1="40" y1="211" x2="480" y2="211" stroke="#2e7d32" stroke-width="3"/>
<rect x="40" y="195" width="180" height="13" fill="#b9cbd9" stroke="#5d7f9a" stroke-width="1.4"/>
<path d="M190,208.5 H226 V191 H206" fill="none" stroke="#2e7d32" stroke-width="3.6" stroke-linejoin="round"/>
<rect x="230" y="180" width="32" height="29" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.4"/>
<rect x="266" y="120" width="214" height="80" fill="url(#hatchRed)" stroke="#c62828" stroke-width="1.4"/>
<path d="M266,205 H480" fill="none" stroke="#c62828" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="5 4"/>
<path d="M265,205 V120" fill="none" stroke="#c62828" stroke-width="4" stroke-linejoin="round"/>
<text class="side" x="130" y="170" text-anchor="middle">VINYL SIDING</text>
<text class="side" x="372" y="106" text-anchor="middle">EIFS / STUCCO / VENEER</text>
<circle cx="150" cy="201" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="150" y="205.5">1</text>
<circle cx="200" cy="180" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="200" y="184.5">2</text>
<circle cx="246" cy="194" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="246" y="198.5">3</text>
<circle cx="84" cy="211" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="84" y="215.5">4</text>
<circle cx="330" cy="222" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="330" y="226.5">5</text>
<circle cx="300" cy="262" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="300" y="266.5">6</text>
<circle cx="390" cy="160" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="390" y="164.5">7</text>
<circle cx="265" cy="140" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="265" y="144.5">8</text>
<circle cx="120" cy="297" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="120" y="301.5">9</text>
<circle cx="530" cy="52" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="56.5">1</text>
<text class="lab2" x="550" y="57">Vinyl siding</text>
<text class="note" x="550" y="75">Siding | SQ FT, страница Siding</text>
<circle cx="530" cy="102" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="106.5">2</text>
<text class="lab2" x="550" y="107">J-channel у края siding</text>
<text class="mono2" x="550" y="125">Ext Casing | Vinyl J-channel | LFT</text>
<circle cx="530" cy="152" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="156.5">3</text>
<text class="lab2" x="550" y="157">Wood / PVC trim на стыке</text>
<text class="mono2" x="550" y="175">casing, corner, band | LFT</text>
<circle cx="530" cy="202" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="206.5">4</text>
<text class="lab2" x="550" y="207">WRB под любой облицовкой</text>
<text class="mono2" x="550" y="225">Vapor Barrier | SQ FT</text>
<circle cx="530" cy="252" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="256.5">5</text>
<text class="lab2" x="550" y="257">Sheathing</text>
<text class="mono2" x="550" y="275">Wall Sheathing | 4x8</text>
<circle cx="530" cy="302" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="306.5">6</text>
<text class="lab2" x="550" y="307">Каркас, furring если показан</text>
<text class="note" x="550" y="325">в строках стены</text>
<circle cx="530" cy="352" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="356.5">7</text>
<text class="lab2" x="550" y="357">EIFS, stucco, stone, brick</text>
<text class="red" x="550" y="375">by others, не считаем</text>
<circle cx="530" cy="402" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="406.5">8</text>
<text class="lab2" x="550" y="407">Casing bead, lath, base coat</text>
<text class="red" x="550" y="425">by others, идут с системой</text>
<circle cx="530" cy="452" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="456.5">9</text>
<text class="lab2" x="550" y="457">Gypsum</text>
<text class="red" x="550" y="475">by others, не считаем</text>
<rect x="40" y="350" width="440" height="226" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="h" x="56" y="378">J-channel: чей</text>
<circle cx="66" cy="404" r="10" fill="#2e7d32"/><path d="M61.5,404 L65,407.5 L71,400" fill="none" stroke="#fff" stroke-width="2.2"/>
<text class="ink" x="86" y="409">Vinyl siding: J-channel наш. Вокруг окон и дверей,</text>
<text class="ink" x="86" y="428">под soffit и frieze, по rake, на стыке с другим</text>
<text class="ink" x="86" y="447">материалом.</text>
<circle cx="66" cy="474" r="10" fill="#c62828"/><path d="M62,470 L70,478 M70,470 L62,478" fill="none" stroke="#fff" stroke-width="2.2"/>
<text class="ink" x="86" y="479">EIFS / stucco: профиль у края системы это casing</text>
<text class="ink" x="86" y="498">bead. Он by others, как J-channel его не пишем.</text>
<circle cx="66" cy="530" r="10" fill="#c62828"/><path d="M62,526 L70,534 M70,526 L62,534" fill="none" stroke="#fff" stroke-width="2.2"/>
<text class="ink" x="86" y="535">J-channel и 5/4 casing на одни и те же проёмы:</text>
<text class="ink" x="86" y="554">при vinyl строка одна.</text>
</svg>
