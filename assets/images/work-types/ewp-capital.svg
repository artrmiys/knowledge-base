<rect x="436" y="210" width="84" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<rect x="436" y="288" width="84" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4"/>
<path d="M520,192 l6,14 l-10,14 l10,14 l-10,14 l10,14 l-10,14 l10,14 l-6,14" fill="#fff" stroke="#3a3f44" stroke-width="1.2"/>
<rect x="400" y="210" width="18" height="90" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<rect x="418" y="210" width="18" height="90" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6"/>
<path d="M410,207 H400 V303 H380" fill="none" stroke="#4d5861" stroke-width="3.2"/>
<path d="M426,207 H436 V303 H456" fill="none" stroke="#4d5861" stroke-width="3.2"/>
<rect x="402" y="300" width="32" height="164" fill="url(#endgrain)" stroke="#6c4b2a" stroke-width="1.4"/>
<line x1="60" y1="464" x2="540" y2="464" stroke="#3a3f44" stroke-width="1.4"/>
<text class="note" x="160" y="400">сечение I-joist</text>
<rect x="200" y="412" width="40" height="8" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="216" y="420" width="8" height="34" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1"/>
<rect x="200" y="448" width="40" height="8" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<circle cx="245" cy="255" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="245" y="259.5">1</text>
<circle cx="418" cy="255" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="418" y="259.5">2</text>
<circle cx="60" cy="255" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="60" y="259.5">3</text>
<circle cx="388" cy="318" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="388" y="322.5">4</text>
<circle cx="98" cy="390" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="98" y="394.5">5</text>
<circle cx="300" cy="186" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="300" y="190.5">6</text>
<circle cx="450" cy="390" r="11" fill="#7d8791" stroke="#fff" stroke-width="1.5"/><text class="numt" x="450" y="394.5">7</text>
<circle cx="575" cy="62" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="66.5">1</text>
<text class="lab2" x="595" y="67">I-joists, серия как показана</text>
<text class="mono2" x="595" y="85">11 7/8 TJI 210 16"</text>
<circle cx="575" cy="118" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="122.5">2</text>
<text class="lab2" x="595" y="123">Beam LVL / PSL / GL</text>
<text class="mono2" x="595" y="141">(2) 1 3/4 x 11 7/8 LVL 14</text>
<circle cx="575" cy="174" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="178.5">3</text>
<text class="lab2" x="595" y="179">Engineered rim</text>
<text class="mono2" x="595" y="197">Rim | LFT x 1.05</text>
<circle cx="575" cy="230" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="234.5">4</text>
<text class="lab2" x="595" y="235">Hangers к EWP, top mount</text>
<text class="mono2" x="595" y="253">ITS, HIT | pcs</text>
<circle cx="575" cy="286" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="290.5">5</text>
<text class="lab2" x="595" y="291">2x studs, plates</text>
<text class="red" x="595" y="309">не считаем</text>
<circle cx="575" cy="342" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="346.5">6</text>
<text class="lab2" x="595" y="347">Subfloor, trusses, ties, nails</text>
<text class="red" x="595" y="365">не считаем</text>
<circle cx="575" cy="398" r="11" fill="#7d8791" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="402.5">7</text>
<text class="lab2" x="595" y="403">Post под балкой</text>
<text class="note" x="595" y="421">только если scope просит</text>
<text class="ink" x="40" y="496">Frame. EWP by others - зеркально: 1-4 убираем из книги, каркас 2x и posts считаем.</text>
</svg>
