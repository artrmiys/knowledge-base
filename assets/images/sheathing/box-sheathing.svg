<rect x="300" y="354" width="56" height="150" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.1" stroke-dasharray="4 3"/>
<rect x="286" y="70" width="14" height="120" fill="url(#hatchGrey)" stroke="#9aa4ad" stroke-width="1.2" />
<rect x="286" y="354" width="14" height="150" fill="url(#hatchGrey)" stroke="#9aa4ad" stroke-width="1.2" />
<rect x="286" y="190" width="14" height="164" fill="url(#sheath)" stroke="#2e7d32" stroke-width="2.2" />
<line class="dim" x1="260" y1="190" x2="260" y2="354"/>
<text class="dimt" x="260" y="272" text-anchor="middle" ></text>
<text class="lab2" x="252" y="266" text-anchor="end" >box</text>
<text class="small" x="252" y="284" text-anchor="end" >height</text>
<path d="M280,70 l8,-6 l8,6 l8,-6 l8,6 l8,-6 l8,6 l8,-6 l8,6 l8,-6 l8,6" fill="none" stroke="#3a3f44" stroke-width="1"/><path d="M280,504 l8,-6 l8,6 l8,-6 l8,6 l8,-6 l8,6 l8,-6 l8,6 l8,-6 l8,6" fill="none" stroke="#3a3f44" stroke-width="1"/><text class="side" x="240" y="530" >EXT</text>
<text class="side" x="320" y="530" >INT</text>
<line class="lead" x1="548" y1="110" x2="298" y2="110"/>
<text class="lab2" x="560" y="106" >Wall panel / full-height sheathing</text>
<text class="small" x="560" y="124" >в панели (by others) или Wall Sheathing</text>
<line class="lead" x1="548" y1="200" x2="360" y2="197"/>
<text class="note" x="560" y="196" >Btm plate верхней стены</text>
<line class="lead" x1="548" y1="270" x2="298" y2="270"/>
<text class="lab" x="560" y="266" >Box sheathing</text>
<text class="mono" x="560" y="286" >Box Sheathing | 7/16 OSB | SQ FT</text>
