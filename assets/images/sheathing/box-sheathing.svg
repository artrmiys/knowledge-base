<text class="note" x="640" y="500" >Truss heel: полоса от top plate</text>
<text class="note" x="640" y="518" >до низа кровли, своя страница</text>
<text class="mono2" x="640" y="536" >trussheel 1.25 | LFT</text>
</svg>
