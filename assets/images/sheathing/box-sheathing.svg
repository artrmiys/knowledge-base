<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
  <title id="t">Box sheathing: the band at floor level</title>
  <desc id="d">Section at a floor: wall below with double top plate, rim and joists, subfloor, bottom plate of the wall above. Box sheathing covers the floor band between the two walls. Inset: truss heel band for contrast.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="599" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<rect x="200" y="40" width="50" height="128" fill="url(#batt)" stroke="#caa64a" stroke-width="1"/>
<rect x="200" y="40" width="50" height="128" fill="none" stroke="#3a3f44" stroke-width="1.4"/>
<rect x="200" y="168" width="50" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="180" width="250" height="10" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<rect x="212" y="190" width="238" height="80" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="190" width="12" height="80" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="270" width="50" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="282" width="50" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="294" width="50" height="136" fill="url(#batt)" stroke="#caa64a" stroke-width="1"/>
<rect x="200" y="294" width="50" height="136" fill="none" stroke="#3a3f44" stroke-width="1.4"/>
<path d="M450,178 l-5,12 l10,14 l-10,14 l10,14 l-10,14 l5,16" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<path d="M192,40 l10,-5 l12,9 l12,-9 l12,9 l12,-5 M192,430 l10,5 l12,-9 l12,9 l12,-9 l12,5" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<rect x="188" y="40" width="12" height="140" fill="url(#hatchGrey)" stroke="#9aa4ad" stroke-width="1.2"/>
<rect x="188" y="270" width="12" height="160" fill="url(#hatchGrey)" stroke="#9aa4ad" stroke-width="1.2"/>
<rect x="188" y="180" width="12" height="90" fill="url(#sheath)" stroke="#2e7d32" stroke-width="2.6"/>
<line x1="140" y1="180" x2="140" y2="270" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="lab" x="128" y="222" text-anchor="end">box</text>
<text class="note" x="128" y="242" text-anchor="end">высота</text>
<text class="side" x="110" y="420" text-anchor="middle">EXT</text>
<text class="side" x="340" y="420" text-anchor="middle">INT</text>
<circle cx="194" cy="225" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="194" y="229.5">1</text>
<circle cx="194" cy="100" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="194" y="104.5">2</text>
<circle cx="194" cy="350" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="194" y="354.5">2</text>
<circle cx="225" cy="174" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="225" y="178.5">3</text>
<circle cx="225" cy="282" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="225" y="286.5">3</text>
<circle cx="330" cy="230" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="330" y="234.5">4</text>
<circle cx="520" cy="60" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="520" y="64.5">1</text>
<text class="lab2" x="540" y="65">Box sheathing</text>
<text class="mono2" x="540" y="83">Box Sheathing | 7/16" Zip | 4x8</text>
<text class="mono2" x="540" y="100">периметр этажа x высота box</text>
<circle cx="520" cy="134" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="520" y="138.5">2</text>
<text class="lab2" x="540" y="139">Обшивка стены выше и ниже</text>
<text class="note" x="540" y="157">Wall Sheathing, либо в панели</text>
<text class="note" x="540" y="174">by others на panel-job</text>
<circle cx="520" cy="208" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="520" y="212.5">3</text>
<text class="lab2" x="540" y="213">Plates стен</text>
<text class="note" x="540" y="231">в строках стен</text>
<circle cx="520" cy="282" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="520" y="286.5">4</text>
<text class="lab2" x="540" y="287">Rim, joists, subfloor</text>
<text class="note" x="540" y="305">перекрытие: свои страницы</text>
<text class="ink" x="520" y="370">Со своей строкой Tape (только с Zip):</text>
<text class="mono2" x="520" y="392">Tape | Zip Tape | LFT</text>
<text class="mono2" x="520" y="414">SQ FT x 0.4 x 1.1</text>
<rect x="40" y="462" width="800" height="118" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="ink" x="56" y="488">Box = только полоса между стенами: rim, торцы joists, subfloor. Не вся стена.</text>
<text class="ink" x="56" y="510">Длина = наружный периметр этажа из линий ext, высота = глубина перекрытия с subfloor</text>
<text class="ink" x="56" y="532">по разрезу. Отдельного замера нет. Проёмы из полосы не вычитаем.</text>
<text class="ink" x="56" y="554">У кровли похожая полоса называется Truss Heel: своя страница и своя строка.</text>
</svg>
