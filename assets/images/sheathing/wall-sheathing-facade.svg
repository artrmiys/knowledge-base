<text class="inkb" x="56" y="572">Каждая полоса считается один раз и в своей строке: стена, box, gable, heel, parapet.</text>
<text class="ink" x="56" y="596">Tape (только с Zip), LFT:</text>
<text class="mono2" x="232" y="596">(SQ FT x 0.4 + периметр окон этажа) x 1.1</text>
<text class="ink" x="592" y="596">у полос: SQ FT x 0.4 x 1.1</text>
