<text class="lab2" x="560" y="55">Стена этажа: LFT x высота</text>
<text class="mono2" x="560" y="73">Wall Sheathing | 4x8</text>
<text class="mono2" x="560" y="90">SQ FT / 32 x 1.1, из линий ext</text>
