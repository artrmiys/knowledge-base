<text class="lab2" x="560" y="203">Gable: Area в ветке gables</text>
<text class="mono2" x="560" y="221">Wall Sheathing | 4x8</text>
<text class="mono2" x="560" y="238">в блоке Gable Walls</text>
<circle cx="540" cy="272" r="11" fill="#00796b" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="276.5">4</text>
<text class="lab2" x="560" y="277">Truss heel на eave-сторонах</text>
<text class="mono2" x="560" y="295">Truss Heel Sheathing | 4x8</text>
<text class="mono2" x="560" y="312">ветка trussheel</text>
<circle cx="540" cy="346" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="350.5">5</text>
<text class="lab2" x="560" y="351">Проём шире 4': вычитаем</text>
<text class="note" x="560" y="369">один раз, по своему этажу;</text>
<text class="note" x="560" y="386">ворота гаража всегда</text>
<circle cx="540" cy="420" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="424.5">6</text>
