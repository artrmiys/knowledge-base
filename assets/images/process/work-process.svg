<text class="note" x="343" y="590" style="font-size:17px">секции Changes и Open items</text>
<rect x="20" y="644" width="30" height="20" rx="4" fill="#e9ecef" stroke="#6b7378" stroke-width="2"/><text class="note" x="60" y="660" style="font-size:17px">автоматика при приёме</text>
<rect x="360" y="644" width="30" height="20" rx="4" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/><text class="note" x="400" y="660" style="font-size:17px">эстиматор</text>
<rect x="700" y="644" width="30" height="20" rx="4" fill="#dbeafe" stroke="#1e88e5" stroke-width="2"/><text class="note" x="740" y="660" style="font-size:17px">сдача</text>
</svg>
