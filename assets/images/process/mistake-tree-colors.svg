<text class="green" x="70" y="55">Так: свой Color и CountSymbol</text>
<text class="ink" x="48" y="276">Легенда и PDF читаются: видно, где какая</text>
<text class="ink" x="48" y="295">стена, где посты, где holdowns.</text>
<text class="note" x="48" y="330">Новая позиция: сразу свой цвет, у Count</text>
<text class="note" x="48" y="349">ещё и свой значок. Split даёт цвет сам.</text>
<text class="note" x="48" y="368">Серый занят под bft.</text>
<circle cx="472" cy="50" r="10" fill="#c62828"/><path d="M468,46 L476,54 M476,46 L468,54" fill="none" stroke="#fff" stroke-width="2.2"/>
<text class="red" x="490" y="55">Не так: всё одним цветом и значком</text>
<text class="ink" x="468" y="276">Стены не отличить, посты и holdowns</text>
<text class="ink" x="468" y="295">выглядят одинаково: проверить нельзя.</text>
