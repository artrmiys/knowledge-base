-serif;fill:#1e88e5">Line</text><text x="580" y="477" style="font:400 14px Inter, 'Segoe UI', Arial, sans-serif;fill:#4b5563">элемент лестницы</text><path d="M47,78 V499 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M74,493 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="102" y="504" style="font:600 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">shear walls</text><path d="M81,510 V526 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M108,520 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="136" y="531" style="font:600 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">1st</text><path d="M115,537 V553 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M142,547 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="170" y="558" style="font:600 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">shear</text><path d="M149,564 V580 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><rect x="176" y="574" width="14" height="12" rx="2" fill="#2e7d32" opacity="0.85"/><text x="198" y="585" style="font:500 16px 'JetBrains Mono', Consolas, monospace;fill:#2e7d32">SW1-1</text><text x="470" y="585" style="font:600 15px Inter, 'Segoe UI', Arial, sans-serif;fill:#1e88e5">Line</text><text x="580" y="585" style="font:400 14px Inter, 'Segoe UI', Arial, sans-serif;fill:#4b5563">марка по schedule, сегмент стены</text><path d="M115,537 V607 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M142,601 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="170" y="612" style="font:600 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">holdowns</text><path d="M149,618 V634 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><rect x="176" y="628" width="14" height="12" rx="2" fill="#2e7d32" opacity="0.85"/><text x="198" y="639" style="font:500 16px 'JetBrains Mono', Consolas, monospace;fill:#2e7d32">HDU11 SB1x30 S2.2</text><text x="470" y="639" style="font:600 15px Inter, 'Segoe UI', Arial, sans-serif;fill:#1e88e5">Count</text><text x="580" y="639" style="font:400 14px Inter, 'Segoe UI', Arial, sans-serif;fill:#4b5563">модель, анкер, лист; точка в узле</text><text class="lab2" x="470" y="40" fill="#1e88e5">Инструмент</text>
<text class="lab2" x="580" y="40" >Что несёт имя</text>
<text class="note" x="40" y="674" >Beam округляет длину: до 8' вверх до целого фута, длиннее до чётного. Built-up балка = одна точка с (n) в имени.</text>
<text class="small" x="40" y="694" >Headers внутри панелей на panel-job не рисовать. Holdown к бетону один, через деревянное перекрытие два (btm и top).</text>
</svg>
