ter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">beams</text><path d="M149,213 V229 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><rect x="176" y="223" width="14" height="12" rx="2" fill="#2e7d32" opacity="0.85"/><text x="198" y="234" style="font:500 16px 'JetBrains Mono', Consolas, monospace;fill:#2e7d32">FB1 8</text><text x="470" y="234" style="font:600 15px Inter, 'Segoe UI', Arial, sans-serif;fill:#1e88e5">Beam</text><text x="580" y="234" style="font:400 14px Inter, 'Segoe UI', Arial, sans-serif;fill:#4b5563">марка или сечение, длина в футах</text><path d="M115,132 V256 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M142,250 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="170" y="261" style="font:600 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">headers</text><path d="M149,267 V283 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M176,277 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="204" y="288" style="font:600 16px Inter, 'Segoe UI', Arial, sans-serif;fill:#5b6670">ext</text><text x="580" y="288" style="font:400 14px Inter, 'Segoe UI', Arial, sans-serif;fill:#4b5563">ext или int</text><path d="M183,294 V310 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><rect x="210" y="304" width="14" height="12" rx="2" fill="#2e7d32" opacity="0.85"/><text x="232" y="315" style="font:500 16px 'JetBrains Mono', Consolas, monospace;fill:#2e7d32">ext H228 4</text><text x="470" y="315" style="font:600 15px Inter, 'Segoe UI', Arial, sans-serif;fill:#1e88e5">Count</text><text x="580" y="315" style="font:400 14px Inter, 'Segoe UI', Arial, sans-serif;fill:#4b5563">марка, длина; точка на перемычке</text><path d="M115,132 V337 h25" fill="none" stroke="#b9c1c8" stroke-width="1.3"/><path d="M142,331 h8 l3,3 h11 v11 h-22 z" fill="#f1c40f" stroke="#5b6670" stroke-width="1" opacity="0.9"/><text x="170" y="342" style="font:600 16px Inter, 