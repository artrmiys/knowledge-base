<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img" aria-labelledby="t d">
  <title id="t">Porch section: floor area, ceiling joists and ceiling</title>
  <desc id="d">Section of a covered porch at a house wall: floor with decking, post and beam at the front, roof rafters above, ceiling joists hung from a ledger at the wall to the beam, two layers of exterior gypsum on the ceiling. Legend lists DFL rows.</desc>
