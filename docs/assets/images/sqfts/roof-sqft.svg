<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 596" role="img" aria-labelledby="t d">
  <title id="t">Roof SQFT: plan area by pitch and flat roof layers</title>
  <desc id="d">Top left: roof plan with two slopes, each an Area named rf 6 by its pitch. Top right: the slope factor table, applied once in Excel. Bottom: flat roof build-up where every layer, EPDM included, is its own row taking the same plan area.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="595" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="h" x="40" y="44">Roof plan: Area по плановой проекции</text>
<rect x="50" y="70" width="330" height="200" fill="#eef1f4" stroke="#3a3f44" stroke-width="1.4"/>
<rect x="55" y="75" width="320" height="92.0" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 4"/>
<rect x="55" y="173.0" width="320" height="92.0" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 4"/>
<line x1="50" y1="170.0" x2="380" y2="170.0" stroke="#1f2a1f" stroke-width="3"/>
<line x1="110" y1="156.0" x2="110" y2="92" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<line x1="110" y1="184.0" x2="110" y2="248" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<line x1="320" y1="156.0" x2="320" y2="92" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<line x1="320" y1="184.0" x2="320" y2="248" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="173.0" y="106" width="84" height="28" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2" rx="5"/>
<text class="mono" x="215.0" y="126" text-anchor="middle">rf 6</text>
<rect x="173.0" y="206.0" width="84" height="28" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2" rx="5"/>
<text class="mono" x="215.0" y="226.0" text-anchor="middle">rf 6</text>
<text class="note" x="215.0" y="162.0" text-anchor="middle">ridge</text>
<text class="note" x="50" y="292">eave</text>
<text class="note" x="380" y="292" text-anchor="end">стрелки: вниз по скату</text>
<text class="ink" x="40" y="320">Имя несёт уклон: rf 6 = 6:12. Один уклон и один</text>
<text class="ink" x="40" y="339">материал = одна позиция в sqfts.</text>
<text class="h" x="450" y="44">Коэффициент уклона: один раз, в Excel</text>
<text class="mono2" x="450" y="70">sqrt(1 + (rise/12)^2)</text>
<text class="inkb" x="450" y="102">Pitch</text>
<text class="inkb" x="530" y="102">Factor</text>
<line x1="450" y1="110" x2="600" y2="110" stroke="#3a3f44" stroke-width="1.1"/>
<text class="mono2" x="450" y="132">4:12</text>
<text class="mono" x="530" y="132">1.054</text>
<text class="mono2" x="450" y="154">6:12</text>
<text class="mono" x="530" y="154">1.118</text>
<text class="mono2" x="450" y="176">8:12</text>
<text class="mono" x="530" y="176">1.202</text>
<text class="mono2" x="450" y="198">12:12</text>
<text class="mono" x="530" y="198">1.414</text>
<polygon points="650,200 810,200 810,120" fill="#f3f4f6" stroke="#3a3f44" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="650" y1="200" x2="810" y2="120" stroke="#e65100" stroke-width="4" stroke-linecap="round"/>
<text class="note" x="818" y="166">rise 6</text>
<text class="note" x="700" y="220">run 12</text>
<text style="fill:#e65100" class="lab2" x="656" y="138">скат 13.42</text>
<rect x="436" y="232" width="408" height="76" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="mono2" x="450" y="256">Roof Sheathing | 19/32" | 4x8</text>
<text class="mono" x="450" y="278">=ОКРВВЕРХ(SQFT*1.118/32*1.1;1)</text>
<text class="note" x="450" y="298">rf 6: 1000 SQ FT в плане дают 39 листов</text>
<text class="h" x="40" y="376">Flat roof: слои по одной площади</text>
<rect x="50" y="402" width="330" height="10" fill="#37474f" stroke="#37474f" stroke-width="1"/>
<rect x="50" y="412" width="330" height="22" fill="#eef0f2" stroke="#9aa4ad" stroke-width="1.2"/>
<rect x="50" y="434" width="330" height="44" fill="url(#rigid)" stroke="#d9a441" stroke-width="1.2"/>
<rect x="50" y="478" width="330" height="22" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<rect x="64" y="500" width="14" height="64" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="126" y="500" width="14" height="64" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="188" y="500" width="14" height="64" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="250" y="500" width="14" height="64" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="312" y="500" width="14" height="64" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<circle cx="398" cy="399" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="398" y="403.5">1</text>
<circle cx="398" cy="423" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="398" y="427.5">2</text>
<circle cx="398" cy="456" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="398" y="460.5">3</text>
<circle cx="398" cy="489" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="398" y="493.5">4</text>
<circle cx="398" cy="532" r="11" fill="#6b7680" stroke="#fff" stroke-width="1.5"/><text class="numt" x="398" y="536.5">5</text>
<circle cx="450" cy="396" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="450" y="400.5">1</text>
<text class="mono2" x="470" y="401">EPDM | SQ FT</text>
<circle cx="450" cy="426" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="450" y="430.5">2</text>
<text class="mono2" x="470" y="431">Densdeck | SQ FT</text>
<circle cx="450" cy="456" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="450" y="460.5">3</text>
<text class="mono2" x="470" y="461">Rigid Insulation | SQ FT</text>
<circle cx="450" cy="486" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="450" y="490.5">4</text>
<text class="mono2" x="470" y="491">Roof Sheathing at Flat Roofs | 3/4" | 4x8</text>
<circle cx="450" cy="516" r="11" fill="#6b7680" stroke="#fff" stroke-width="1.5"/><text class="numt" x="450" y="520.5">5</text>
<text class="note" x="470" y="521">Joists: Roof Framing, не площадь</text>
<text class="ink" x="450" y="556">Позиция sqfts/flat, коэффициент 1: каждый слой своей</text>
<text class="ink" x="450" y="575">строкой, площадь одна и та же.</text>
</svg>
