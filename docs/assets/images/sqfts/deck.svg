<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d">
  <title id="t">Deck section: ledger, joist in hanger, beam on post, decking, railing</title>
  <desc id="d">Section through a deck: house wall with bolted ledger and flashing, joist in a hanger, drop beam on a post with cap and base on a footing, rim joist, decking boards, railing post with cap. Callouts give the takeoff lines the deck SQFT drives.</desc>
