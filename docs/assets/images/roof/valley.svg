<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">Valley rafter on a roof plan</title>
  <desc id="d">Roof plan at the junction of the main roof and a gable addition: two valley rafters run from the inside corners to the end of the addition ridge, jack rafters of both slopes butt into them. Legend with the tool, tree name and DFL row; the true length is the plan length times the hip and valley factor.</desc>
