<polygon points="466.0,334.9 463.2,326.4 494.5,315.9 497.3,324.5" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6" stroke-linejoin="round" />
<polygon points="235.2,402.2 345.0,118.0 317.0,107.2 207.2,391.4" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4" stroke-linejoin="round" />
<polygon points="478.8,321.2 345.0,118.0 370.1,101.5 503.9,304.6" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4" stroke-linejoin="round" />
<polygon points="207.2,391.4 317.0,107.2 309.6,104.3 199.8,388.5" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.3" stroke-linejoin="round" />
<polygon points="503.9,304.6 370.1,101.5 376.7,97.1 510.5,300.2" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.3" stroke-linejoin="round" />
<rect x="339" y="74" width="12" height="40" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.2" />
<line class="lead" x1="668" y1="120" x2="455" y2="150"/>
<text class="lab2" x="680" y="116" >Верхний настил</text>
<text class="mono" x="680" y="134" >Roof Sheathing overframes | SQ FT</text>
<line class="lead" x1="668" y1="190" x2="500" y2="220"/>
<text class="lab2" x="680" y="186" >Rafters overframe</text>
<text class="mono" x="680" y="204" >J Area: сечение, шаг; LFT / pcs</text>
<line class="lead" x1="668" y1="260" x2="488.814" y2="319.151"/>
<text class="lab2" x="680" y="256" >Sleepers 2x6 flat (valley plates)</text>
<text class="mono" x="680" y="274" >Sleepers | 2x6 | LFT, наша строка</text>
<line class="lead" x1="668" y1="330" x2="560" y2="308"/>
<text class="lab2" x="680" y="326" >Нижний настил под overframe</text>
<text class="note" x="680" y="344" >по детали: иногда не кладут</text>
<line class="lead" x1="668" y1="390" x2="540" y2="335"/>
<text class="note" x="680" y="386" >Нижние rafters / trusses</text>
<text class="small" x="680" y="404" >страница Roof Framing</text>
