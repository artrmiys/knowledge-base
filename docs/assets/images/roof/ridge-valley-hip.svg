<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d">
  <title id="t">Ridge, hip and valley on a roof plan</title>
  <desc id="d">Plan of a hip roof with a gable addition: ridge, four hips running from the corners to the ridge ends, two valleys on the junction with the addition. Each line is numbered; the legend gives the tool, the tree path and the DFL row.</desc>
