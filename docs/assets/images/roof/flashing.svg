<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
  <title id="t">Roof to wall: step flashing, kick-out and siding over the flashing</title>
  <desc id="d">Oblique view of a roof slope meeting a side wall: shingle courses, step flashing pieces stepping up the intersection under the siding, kick-out at the bottom end over the gutter, counter flashing note for masonry.</desc>
