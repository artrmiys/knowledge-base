<line class="lead" x1="688" y1="90" x2="470" y2="145"/>
<text class="lab" x="700" y="90" >Siding поверх flashing</text>
<text class="small" x="700" y="109" >зазор 1-2"; на кирпиче: counter flashing</text>
<line class="lead" x1="688" y1="250" x2="124.4" y2="389"/>
