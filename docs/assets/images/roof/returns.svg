<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" role="img" aria-labelledby="t d">
  <title id="t">Eave return at a gable corner</title>
  <desc id="d">Top: gable end elevation showing where the eave, the rake and the return are. Bottom: two kinds of return in close-up, a boxed cornice return with soffit, fascia and crown, and a pork chop return closed with a board. Legend with DFL rows and units.</desc>
