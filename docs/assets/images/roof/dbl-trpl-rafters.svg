<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">Doubled and tripled rafters around a roof opening</title>
  <desc id="d">Plan of one roof slope between the ridge beam and the wall: common rafters at 16 inches on centre, a skylight opening with a doubled rafter on each side and headers above and below, cut rafters on the headers, and a tripled rafter under a load. Legend gives the tool, tree name and DFL row for each part.</desc>
