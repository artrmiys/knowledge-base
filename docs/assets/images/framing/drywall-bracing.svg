<line x1="200" y1="36" x2="200" y2="66" stroke="#8a6a3f" stroke-width="3"/><line x1="230" y1="36" x2="230" y2="66" stroke="#8a6a3f" stroke-width="3"/><line x1="260" y1="36" x2="260" y2="66" stroke="#8a6a3f" stroke-width="3"/><line x1="290" y1="36" x2="290" y2="66" stroke="#8a6a3f" stroke-width="3"/><line x1="245" y1="36" x2="245" y2="66" stroke="#2e7d32" stroke-width="4"/><text class="note" x="305" y="56" >joists и стена параллельны: гипсу потолка не к чему крепиться у стены</text>
<text class="note" x="60" y="524" >Dropped soffit это не deflection track. RCP показывает bracing и soffit framing, которых нет на structural.</text>
