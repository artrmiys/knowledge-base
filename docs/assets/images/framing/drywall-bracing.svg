<text class="lab2" x="60" y="112" >Joists (end view), стена между ними</text>
<line class="lead" x1="290" y1="262" x2="350" y2="228"/>
<text class="lab2" x="60" y="266" >Ceiling gypsum (by others)</text>
<line class="lead" x1="290" y1="330" x2="410" y2="330"/>
<text class="lab2" x="60" y="334" >Gypsum стены (by others)</text>
<line class="lead" x1="290" y1="400" x2="405" y2="400"/>
<text class="lab2" x="60" y="404" >Studs: стена параллельна joists</text>
<line class="lead" x1="688" y1="240" x2="454" y2="218"/>
<text class="lab" x="700" y="240" >Drywall ledger 2x6 flat</text>
