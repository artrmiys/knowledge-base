<text class="small" x="700" y="277" >demising: both sides; exterior: one side</text>
<line class="lead" x1="688" y1="330" x2="472" y2="200"/>
<text class="lab" x="700" y="330" >2x4 bracing (kicker)</text>
<text class="mono" x="700" y="349" >Bracing | 2x4 | LFT</text>
