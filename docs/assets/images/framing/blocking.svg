<circle cx="50" cy="471" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="50" y="475.5">1</text>
<text class="lab2" x="70" y="476">Blocking вразбежку</text>
<text class="mono2" x="70" y="495">Blocking | 2x10 | D 16</text>
<text class="mono" x="70" y="514">=CEILING(G/D,1)</text>
<text class="note" x="70" y="533">сечение как у joists, доски по 16'</text>
<circle cx="50" cy="560" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="50" y="564.5">2</text>
<text class="lab2" x="70" y="565">Line по ряду</text>
<text class="note" x="70" y="584">G = LFT ряда</text>
