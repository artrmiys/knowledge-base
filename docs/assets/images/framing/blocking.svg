<text class="dimt" x="330" y="58" text-anchor="middle" >ширина перекрытия = LFT blocking</text>
<line class="dim" x1="177" y1="520" x2="277" y2="520"/>
<text class="dimt" x="227" y="534" text-anchor="middle" >16" o.c.</text>
