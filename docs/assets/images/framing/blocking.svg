<text class="dimt" x="659.0" y="250.0" text-anchor="middle">48"</text>
<circle cx="514" cy="150.0" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="514" y="154.5">1</text>
<line class="lead" x1="525" y1="150.0" x2="569" y2="150.0"/>
