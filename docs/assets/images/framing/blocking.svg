<text class="lab2" x="70" y="616">Rim board</text>
<circle cx="176" cy="611" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="176" y="615.5">4</text>
<text class="lab2" x="196" y="616">Joists: свои страницы</text>
<circle cx="480" cy="471" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="480" y="475.5">1</text>
<text class="lab2" x="500" y="476">Кусок на каждой точке линии</text>
<text class="mono2" x="500" y="495">Blocking Flat 48" o.c.</text>
<text class="mono2" x="500" y="514">2x10 | D 16 | H 48</text>
<text class="mono" x="500" y="533">=CEILING(G*12/H*2/D,1)</text>
<circle cx="480" cy="560" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="480" y="564.5">2</text>
<text class="lab2" x="500" y="565">Line вдоль joists через зону</text>
<text class="note" x="500" y="584">G*12/H = число точек на линии</text>
<text class="note" x="500" y="603">2 = ft доски на точку (flat)</text>
<line x1="40" y1="620" x2="840" y2="620" stroke="#e3e7ea" stroke-width="1"/>
<text class="note" x="40" y="645">Стены 10' и выше: два ряда blocking. Exterior blocking FRT, если exterior walls FRT.</text>
