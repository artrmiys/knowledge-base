<rect x="90" y="320" width="16" height="50" fill="none" stroke="#6c4b2a" stroke-width="1" stroke-dasharray="3 3"/><rect x="190" y="320" width="16" height="50" fill="none" stroke="#6c4b2a" stroke-width="1" stroke-dasharray="3 3"/><rect x="290" y="320" width="16" height="50" fill="none" stroke="#6c4b2a" stroke-width="1" stroke-dasharray="3 3"/><rect x="390" y="320" width="16" height="50" fill="none" stroke="#6c4b2a" stroke-width="1" stroke-dasharray="3 3"/><rect x="490" y="320" width="16" height="50" fill="none" stroke="#6c4b2a" stroke-width="1" stroke-dasharray="3 3"/><rect x="106" y="237" width="14" height="83" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4" />
