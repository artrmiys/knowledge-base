<text class="note" x="52" y="332" >2 stud; гипс держат drywall clips</text>
<text class="lab" x="372" y="44" >3-stud corner</text>
<rect x="372" y="62" width="238" height="8" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2" />
<rect x="372" y="62" width="8" height="238" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2" />
<rect x="380" y="70" width="230" height="42" fill="#faf7f2" stroke="#c9c2b6" stroke-width="1" />
<rect x="380" y="112" width="42" height="188" fill="#faf7f2" stroke="#c9c2b6" stroke-width="1" />
<rect x="572" y="70" width="18" height="42" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3" />
