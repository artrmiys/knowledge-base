<rect x="398" y="72" width="18" height="38" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="416" y="70" width="18" height="42" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.5" />
