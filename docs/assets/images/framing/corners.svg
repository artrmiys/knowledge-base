<text class="side" x="120" y="130" >INT</text>
<text class="lab" x="60" y="400" >Wall stick: углы считаем отдельной строкой по этажам</text>
<text class="mono" x="60" y="422" >Corners | 2x4 / 2x6 | pcs (на каждый наружный угол)</text>
<text class="red" x="60" y="450" >Wall panels: углы не считаем, они уже внутри панели. Structural detail (holdown, extra studs) сильнее типового угла.</text>
<rect x="560" y="388" width="22" height="14" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.2"/><text class="cap" x="590" y="400" >stud</text>
<rect x="642.8" y="388" width="22" height="14" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/><text class="cap" x="672.8" y="400" >sheathing</text>
<rect x="761.5999999999999" y="388" width="22" height="14" fill="#eef0f2" stroke="#9aa4ad" stroke-width="1.2"/><text class="cap" x="791.6" y="400" >gypsum (не считаем)</text>
</svg>
