<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">Flush beam and dropped beam: section across the beam</title>
  <desc id="d">Left: a three-ply LVL beam flush with 2x10 joists, the joists hang on face-mount hangers from both sides and the ceiling stays flat; DFL rows Beam (3) Flush and Hangers. Right: the same beam dropped under the joists, the joists bear on top, there are no hangers at the beam and the beam shows below the ceiling; DFL row Beam (3). Both are measured with the Beam tool, C = points x plies.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="lvl" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#dcb886"/><path d="M0,3 H6" stroke="#7a5a2f" stroke-width="0.8" opacity="0.55"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <style>
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .lead{stroke:#2e7d32;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .dim{stroke:#3a3f44;stroke-width:1.1;fill:none;marker-start:url(#tick);marker-end:url(#tick)}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="559" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<line x1="440" y1="24" x2="440" y2="442" stroke="#e3e7ea" stroke-width="1"/>
<text class="h" x="40" y="40">Flush: балка в уровне joists</text>
<text class="note" x="40" y="62">joists висят на hangers с двух сторон</text>
<rect x="40" y="96" width="370" height="8" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<rect x="40" y="104" width="162.0" height="74" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="248.0" y="104" width="162.0" height="74" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="204.0" y="104" width="42" height="74" fill="url(#lvl)" stroke="#7a5a2f" stroke-width="1.6"/>
<line x1="218.0" y1="104" x2="218.0" y2="178" stroke="#7a5a2f" stroke-width="1.2"/>
<line x1="232.0" y1="104" x2="232.0" y2="178" stroke="#7a5a2f" stroke-width="1.2"/>
<rect x="186.0" y="124" width="16" height="56" fill="#9aa5b1" fill-opacity="0.6" stroke="#4d5861" stroke-width="1.2"/>
<path d="M203.0,116 V180 H186.0" fill="none" stroke="#4d5861" stroke-width="2.2"/>
<rect x="248.0" y="124" width="16" height="56" fill="#9aa5b1" fill-opacity="0.6" stroke="#4d5861" stroke-width="1.2"/>
<path d="M247.0,116 V180 H264.0" fill="none" stroke="#4d5861" stroke-width="2.2"/>
<rect x="40" y="180" width="370" height="6" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<path d="M40,92 V190" stroke="#fff" stroke-width="4"/>
<path d="M40,92 l-5,12 l10,14 l-10,14 l10,14 l-10,14 l10,14 l-10,14 l5,8" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<path d="M410,92 V190" stroke="#fff" stroke-width="4"/>
<path d="M410,92 l-5,12 l10,14 l-10,14 l10,14 l-10,14 l10,14 l-10,14 l5,8" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<text class="dimt" x="225.0" y="210" text-anchor="middle">низ балки = низ joists: потолок ровный</text>
<circle cx="225.0" cy="141" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="225.0" y="145.5">1</text>
<circle cx="142.0" cy="141" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="142.0" y="145.5">2</text>
<line class="lead" x1="153.0" y1="141" x2="183.0" y2="141"/>
<circle cx="84" cy="141" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="84" y="145.5">3</text>
<text class="h" x="470" y="40">Dropped: балка под joists</text>
<text class="note" x="470" y="62">joists лежат сверху, hangers на балке нет</text>
<rect x="470" y="96" width="370" height="8" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<rect x="470" y="104" width="370" height="74" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="634.0" y="178" width="42" height="74" fill="url(#lvl)" stroke="#7a5a2f" stroke-width="1.6"/>
<line x1="648.0" y1="178" x2="648.0" y2="252" stroke="#7a5a2f" stroke-width="1.2"/>
<line x1="662.0" y1="178" x2="662.0" y2="252" stroke="#7a5a2f" stroke-width="1.2"/>
<path d="M470,180 H628.0 V258 H682.0 V180 H840 v6 H688.0 V264 H622.0 V186 H470 z" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<path d="M470,92 V190" stroke="#fff" stroke-width="4"/>
<path d="M470,92 l-5,12 l10,14 l-10,14 l10,14 l-10,14 l10,14 l-10,14 l5,8" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<path d="M840,92 V190" stroke="#fff" stroke-width="4"/>
<path d="M840,92 l-5,12 l10,14 l-10,14 l10,14 l-10,14 l10,14 l-10,14 l5,8" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<line x1="696.0" y1="186" x2="746.0" y2="186" stroke="#3a3f44" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="696.0" y1="264" x2="746.0" y2="264" stroke="#3a3f44" stroke-width="0.9" stroke-dasharray="3 3"/>
<line class="dim" x1="740.0" y1="186" x2="740.0" y2="264"/>
<text class="dimt" x="752.0" y="221.0">ниже потолка</text>
<circle cx="655.0" cy="215.0" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="655.0" y="219.5">1</text>
<circle cx="530" cy="141" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="530" y="145.5">3</text>
<circle cx="50" cy="307" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="50" y="311.5">1</text>
<text class="lab2" x="70" y="312">Балка</text>
<text class="mono2" x="70" y="331">Beam (3) Flush | 1 3/4 x 9 1/4 LVL</text>
<text class="note" x="70" y="350">Flush в Label, когда schedule помечает flush</text>
<circle cx="50" cy="377" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="50" y="381.5">2</text>
<text class="lab2" x="70" y="382">Hangers на балке</text>
<text class="mono2" x="70" y="401">Hangers | LUS210 | pcs</text>
<text class="note" x="70" y="420">по одному на конец каждого joist</text>
<circle cx="480" cy="307" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="480" y="311.5">1</text>
<text class="lab2" x="500" y="312">Балка</text>
<text class="mono2" x="500" y="331">Beam (3) | 1 3/4 x 9 1/4 LVL</text>
<text class="note" x="500" y="350">обычная балка: Label без Flush</text>
<circle cx="480" cy="377" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="480" y="381.5">3</text>
<text class="lab2" x="500" y="382">Joists в обеих схемах: страница Joist</text>
<text class="red" x="500" y="401">hangers к этой балке не считаем</text>
<rect x="40" y="462" width="800" height="78" rx="8" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2"/>
<text class="inkb" x="56" y="488">Обе меряются инструментом Beam: одна точка на балку, длина в имени (FB1 14).</text>
<text class="ink" x="56" y="510">C = точки x plies: Beam (3) с 2 точками = 6. Flush или dropped смотри в sections и details.</text>
<text class="ink" x="56" y="530">Разница в строках: у flush свои hangers на каждый joist, у dropped их нет.</text>
</svg>
