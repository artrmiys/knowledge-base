<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d">
  <title id="t">Subfloor sheets and the FRT strip in plan</title>
  <desc id="d">Floor plan from above: 4x8 subfloor sheets laid across the joists, a 4 ft wide FRT strip along the exterior walls, blocking under the inner edge of the strip, adhesive on the joists.</desc>
