<path d="M714,500 V488 H756 V500" fill="none" stroke="#4d5861" stroke-width="3"/><path d="M714,412 V424 H756 V412" fill="none" stroke="#4d5861" stroke-width="3"/><circle cx="735" cy="456.0" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/><rect x="720" y="272" width="30" height="88" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.5" />
<path d="M714,360 V348 H756 V360" fill="none" stroke="#4d5861" stroke-width="3"/><path d="M714,272 V284 H756 V272" fill="none" stroke="#4d5861" stroke-width="3"/><circle cx="735" cy="316.0" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/><rect x="650" y="142" width="170" height="30" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4" />
<rect x="720" y="172" width="30" height="48" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.5" />
<circle cx="735" cy="196" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text class="small" x="560" y="600" >Story posts не склеивать в один без детали continuity.</text>
</svg>
