<rect x="60" y="372" width="240" height="40" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.0" stroke-dasharray="4 3"/>
<text class="small" x="66" y="354" >2nd floor</text>
<rect x="60" y="220" width="240" height="12" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1" />
<rect x="60" y="232" width="240" height="40" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.0" stroke-dasharray="4 3"/>
<text class="small" x="66" y="214" >3rd floor</text>
<rect x="60" y="552" width="240" height="30" fill="url(#conc)" stroke="#6b7378" stroke-width="1.3" />
<rect x="200" y="120" width="30" height="432" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.6" />
<rect x="130" y="90" width="170" height="30" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.4" />
<path d="M194,552 V540 H236 V552" fill="none" stroke="#4d5861" stroke-width="3"/><path d="M194,120 V132 H236 V120" fill="none" stroke="#4d5861" stroke-width="3"/><line class="dim" x1="330" y1="552" x2="330" y2="120"/>
<text class="dimt" x="330" y="336" text-anchor="middle" ></text>
<text class="lab2" x="342" y="330" >высота</text>
<text class="small" x="342" y="348" >от базы</text>
<text class="small" x="342" y="364" >до низа балки</text>
<text class="red" x="342" y="390" >не floor-to-floor</text>
<text class="mono2" x="342" y="416" >6x6 8.2 = высота 8.2 ft</text>
<circle cx="215" cy="300" r="9" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text class="small" x="230" y="305" >1 точка на 3rd floor</text>
<text class="small" x="60" y="600" >Один раз на верхнем этаже, который держит; cap и base по детали.</text>
<text class="lab" x="560" y="46" >Story posts: точка на каждом этаже</text>
<text class="note" x="560" y="66" >только если detail показывает разрыв (cap, base на каждом)</text>
<rect x="560" y="500" width="380" height="12" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1" />
<rect x="560" y="512" width="380" height="40" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.0" stroke-dasharray="4 3"/>
<text class="small" x="566" y="494" >1st floor</text>
<rect x="560" y="360" width="380" height="12" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1" />
<rect x="560" y="372" width="380" height="40" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.0" stroke-dasharray="4 3"/>
<text class="small" x="566" y="354" >2nd floor</text>
<rect x="560" y="220" width="380" height="12" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.1" />
<rect x="560" y="232" width="380" height="40" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.0" stroke-dasharray="4 3"/>
<text class="small" x="566" y="214" >3rd floor</text>
<rect x="560" y="552" width="380" height="30" fill="url(#conc)" stroke="#6b7378" stroke-width="1.3" />
