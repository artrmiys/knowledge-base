<text class="h" x="572" y="60">Три группы стоек</text>
<circle cx="583" cy="98" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="583" y="102.5">1</text>
<rect x="602" y="90" width="22" height="16" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.4"/>
<text class="lab2" x="634" y="103">Field studs</text>
<text class="note" x="602" y="128">по полю стены, по шагу</text>
<text class="note" x="602" y="147">16" o.c.: LFT x 1.1</text>
<text class="note" x="602" y="166">24" o.c.: LFT x 0.625</text>
<circle cx="583" cy="206" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="583" y="210.5">2</text>
<rect x="602" y="198" width="22" height="16" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="1.4"/>
<text class="lab2" x="634" y="211">Extra studs</text>
<text class="note" x="602" y="236">углы, T, king / jack / cripple</text>
<text class="note" x="602" y="255">частично закрыты фактором</text>
<text class="note" x="602" y="274">1.1; corners на stick отдельно</text>
<circle cx="583" cy="314" r="11" fill="#c98a1e" stroke="#fff" stroke-width="1.5"/><text class="numt" x="583" y="318.5">3</text>
<rect x="602" y="306" width="22" height="16" fill="url(#rigid)" stroke="#c98a1e" stroke-width="1.4"/>
<text class="lab2" x="634" y="319">Dbl / extra</text>
<text class="note" x="602" y="344">bearing и demising по</text>
<text class="note" x="602" y="363">stud schedule этажа</text>
<text class="note" x="602" y="382">отдельная строка Extra:</text>
<text class="note" x="602" y="401">16": 0.75, 24": 0.5</text>
<text class="note" x="50" y="474">Plies и шаг берутся из stud schedule каждого этажа: на нижних этажах стойки чаще двойные.</text>
</svg>
