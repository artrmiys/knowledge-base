<text class="note" x="217.0" y="244" text-anchor="middle">opening</text>
<line x1="307.0" y1="400" x2="343.0" y2="400" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="306" y="424">16" o.c.</text>
<path d="M334,74 h158" stroke="#c98a1e" stroke-width="2.4" fill="none"/>
<text class="inkb" x="415.0" y="66" text-anchor="middle">bearing wall: dbl studs</text>
