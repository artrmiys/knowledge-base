<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 706" role="img" aria-labelledby="t d">
  <title id="t">Through bolts: beam to post and nailer on a steel beam</title>
  <desc id="d">Left: beam of two plies seated in a notched post, two through bolts with a washer on each side and a nut. Right: wood nailer bolted to the top flange of a steel beam, bolts staggered at 24 inches on center, with a plan strip below.</desc>
