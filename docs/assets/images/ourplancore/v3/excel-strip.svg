<line x1="458" y1="30" x2="458" y2="580" stroke="#dfe3e8" stroke-width="1.2"/>
<rect x="486" y="338" width="366" height="250" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="lab2" x="500" y="362">Как читать</text>
<circle cx="506" cy="388" r="4.5" fill="#2ad24b" stroke="#2ad24b" stroke-width="1.4"/>
<text class="ink" x="522" y="393">точка горит: шаг входит в ALL</text>
<circle cx="506" cy="414" r="4.5" fill="#fff" stroke="#8a98a5" stroke-width="1.4"/>
<text class="ink" x="522" y="419">пустая: ALL его пропустит (BL)</text>
<text class="note" x="500" y="450">Щелчок по точке меняет состав ALL.</text>
<text class="note" x="500" y="470">Кнопка берёт ветку выделенного корпуса</text>
<text class="note" x="500" y="490">и пишет в открытую книгу из TemplateCom.</text>
<text class="note" x="500" y="510">Секции идут через рабочую зону J:L</text>
<text class="note" x="500" y="530">и макрос книги, framing заменяет свои</text>
<text class="note" x="500" y="550">строки в framing list этажа.</text>
<text class="note" x="500" y="570">В программе полоса одна, сверху вниз.</text>
