<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">Crop to sheet: two corners around a detail on source sheets, crops laid out on a Details sheet</title>
  <desc id="d">Left: two source sheets S401 and A501 with details and a dashed two-corner box around one detail each. Right: a target sheet Details with crops placed left to right at 100 percent, one reduced crop with a red badge 75 percent not true scale, and a round lock button below.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#2e7d32"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="gyp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#eef0f2"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    
    <style>
      .ln{fill:none;stroke:#3a3f44;stroke-width:1.6;stroke-linejoin:round}
      .thin{fill:none;stroke:#3a3f44;stroke-width:1.1}
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .small{font:400 12.5px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 13px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .lead{stroke:#2e7d32;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .leadInk{stroke:#3a3f44;stroke-width:1.3;fill:none;marker-end:url(#arrInk)}
      .leadRed{stroke:#c62828;stroke-width:1.5;fill:none;marker-end:url(#arrRed)}
      .dim{stroke:#3a3f44;stroke-width:1.1;fill:none;marker-start:url(#tick);marker-end:url(#tick)}
      .dimt{font:500 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numc{fill:#2e7d32;stroke:#fff;stroke-width:1.5}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .h{font:700 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .cap{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="469" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="lab" x="20" y="34" >Кроп: два угла вокруг детали на листе-источнике, кропы на листе Details</text>
<rect x="20" y="60" width="200" height="150" fill="#fff" stroke="#3a3f44" stroke-width="1.6"/><rect x="20" y="192" width="200" height="18" fill="#f1f3f5" stroke="#3a3f44" stroke-width="1"/><text class="mono2" x="214" y="205" text-anchor="end" style="font-size:12px">S401</text>
<rect x="30" y="70" width="80" height="60" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M36,124 h68 M36,124 v-48 M36,76 l68,48" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="54.0" y="91.0" width="32.0" height="15.0" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="120" y="70" width="90" height="60" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M126,124 h78 M126,124 v-48 M126,76 l78,48" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="147.0" y="91.0" width="36.0" height="15.0" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="30" y="136" width="80" height="50" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M36,180 h68 M36,180 v-38 M36,142 l68,38" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="54.0" y="153.5" width="32.0" height="12.5" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="116" y="66" width="98" height="68" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/><circle cx="116" cy="66" r="5" fill="#2e7d32"/><circle cx="214" cy="134" r="5" fill="#2e7d32"/><rect x="20" y="230" width="200" height="150" fill="#fff" stroke="#3a3f44" stroke-width="1.6"/><rect x="20" y="362" width="200" height="18" fill="#f1f3f5" stroke="#3a3f44" stroke-width="1"/><text class="mono2" x="214" y="375" text-anchor="end" style="font-size:12px">A501</text>
<rect x="30" y="240" width="90" height="70" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M36,304 h78 M36,304 v-58 M36,246 l78,58" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="57.0" y="264.5" width="36.0" height="17.5" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="130" y="240" width="80" height="60" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M136,294 h68 M136,294 v-48 M136,246 l68,48" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="154.0" y="261.0" width="32.0" height="15.0" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="130" y="306" width="80" height="50" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M136,350 h68 M136,350 v-38 M136,312 l68,38" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="154.0" y="323.5" width="32.0" height="12.5" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="26" y="236" width="98" height="78" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/><circle cx="26" cy="236" r="5" fill="#2e7d32"/><circle cx="124" cy="314" r="5" fill="#2e7d32"/><text class="small" x="20" y="404" fill="#2e7d32" font-weight="600">два угла вокруг детали</text>
<text class="small" x="20" y="420" >(Crop to Sheet в меню листа)</text>
<line x1="222" y1="100" x2="330" y2="150" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr)"/><line x1="222" y1="275" x2="330" y2="200" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340" y="60" width="540" height="300" fill="#fff" stroke="#3a3f44" stroke-width="1.6"/><rect x="340" y="342" width="540" height="18" fill="#f1f3f5" stroke="#3a3f44" stroke-width="1"/><text class="mono2" x="874" y="355" text-anchor="end" style="font-size:12px">Details</text>
<text class="small" x="350" y="82" >кропы слева направо, по чтению, 100 % масштаб</text>
<line x1="350" y1="90" x2="670" y2="90" stroke="#6b7378" stroke-width="1.2" marker-end="url(#arrInk)"/><rect x="354" y="104" width="160" height="112" fill="#fbfbfc" stroke="#2e7d32" stroke-width="1.8"/><rect x="360" y="110" width="148" height="100" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M366,204 h136 M366,204 v-88 M366,116 l136,88" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="404.4" y="145.0" width="59.2" height="25.0" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="530" y="104" width="160" height="112" fill="#fbfbfc" stroke="#2e7d32" stroke-width="1.8"/><rect x="536" y="110" width="148" height="100" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M542,204 h136 M542,204 v-88 M542,116 l136,88" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="580.4" y="145.0" width="59.2" height="25.0" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="706" y="104" width="110" height="78" fill="#fbfbfc" stroke="#2e7d32" stroke-width="1.8"/><rect x="712" y="110" width="98" height="66" fill="#fbfbfc" stroke="#9aa4ad" stroke-width="1"/><path d="M718,170 h86 M718,170 v-54 M718,116 l86,54" stroke="#9aa4ad" stroke-width="1" fill="none"/><rect x="741.4" y="133.1" width="39.2" height="16.5" fill="url(#wood)" stroke="#8a6a3f" stroke-width="0.8"/><rect x="706" y="186" width="128" height="18" rx="4" fill="#c62828"/><text x="770" y="199" text-anchor="middle" style="font:700 11.5px Inter, 'Segoe UI', Arial, sans-serif;fill:#fff">75% - not true scale</text><text class="small" x="354" y="240" >каждый кроп помнит лист-источник (S401, A501) и его масштаб;</text>
<text class="small" x="354" y="256" >уменьшенный кроп получает красный бейдж</text>
<text class="small" x="354" y="288" >кропы печатаются в PDF вместе с замерами на листе</text>
<circle cx="364" cy="394" r="16" fill="#fff" stroke="#3a3f44" stroke-width="1.8"/><rect x="357" y="392" width="14" height="11" rx="2" fill="#3a3f44"/><path d="M360,392 v-5 a4,4 0 0 1 8,0 v5" fill="none" stroke="#3a3f44" stroke-width="2"/><text class="small" x="390" y="399" >Lock crops on this sheet: кропы не двигаются и не удаляются случайно</text>
<text class="note" x="20" y="450" >Кроп хранит ссылку на лист-источник и печатается в PDF.</text>
</svg>
