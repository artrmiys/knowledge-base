<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
  <title id="t">Break and Break H/V on a polyline in the bft item</title>
  <desc id="d">Three frames left to right: a polyline of five segments in the item bft; after Break the same five segments as separate measurements in the same item, total unchanged; after Break H/V the horizontal segments go to bft - Horizontal in one colour and the vertical ones to bft - Vertical in a contrasting colour.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#2e7d32"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="gyp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#eef0f2"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    
    <style>
      .ln{fill:none;stroke:#3a3f44;stroke-width:1.6;stroke-linejoin:round}
      .thin{fill:none;stroke:#3a3f44;stroke-width:1.1}
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .small{font:400 12.5px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 13px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .lead{stroke:#2e7d32;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .leadInk{stroke:#3a3f44;stroke-width:1.3;fill:none;marker-end:url(#arrInk)}
      .leadRed{stroke:#c62828;stroke-width:1.5;fill:none;marker-end:url(#arrRed)}
      .dim{stroke:#3a3f44;stroke-width:1.1;fill:none;marker-start:url(#tick);marker-end:url(#tick)}
      .dimt{font:500 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numc{fill:#2e7d32;stroke:#fff;stroke-width:1.5}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .h{font:700 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .cap{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="429" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<rect x="20" y="40" width="300" height="300" rx="10" fill="#fbfcfd" stroke="#6b7378" stroke-width="1.4"/><text class="lab" x="34" y="66" style="font-size:17px">1. Ломаная</text>
<text class="small" x="34" y="86" >одна позиция bft, 5 отрезков</text>
<line x1="50.0" y1="290.0" x2="150.0" y2="290.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><line x1="150.0" y1="290.0" x2="150.0" y2="200.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><line x1="150.0" y1="200.0" x2="250.0" y2="200.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><line x1="250.0" y1="200.0" x2="250.0" y2="120.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><line x1="250.0" y1="120.0" x2="290.0" y2="120.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="290" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="150" cy="290" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="150" cy="200" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="250" cy="200" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="250" cy="120" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="290" cy="120" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><text class="mono2" x="34" y="318" >bft  1 замер, 5 сегментов</text>
<rect x="350" y="40" width="300" height="300" rx="10" fill="#fbfcfd" stroke="#6b7378" stroke-width="1.4"/><text class="lab" x="364" y="66" style="font-size:17px">2. После Break</text>
<text class="small" x="364" y="86" >пять отдельных сегментов, та же позиция</text>
<line x1="386.0" y1="290.0" x2="474.0" y2="290.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="386.0" cy="290.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="474.0" cy="290.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><line x1="480.0" y1="284.0" x2="480.0" y2="206.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="480.0" cy="284.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="480.0" cy="206.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><line x1="486.0" y1="200.0" x2="574.0" y2="200.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="486.0" cy="200.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="574.0" cy="200.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><line x1="580.0" y1="194.0" x2="580.0" y2="126.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="580.0" cy="194.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="580.0" cy="126.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><line x1="586.0" y1="120.0" x2="614.0" y2="120.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="586.0" cy="120.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="614.0" cy="120.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><text class="mono2" x="364" y="318" >bft  5 замеров; сумма та же</text>
<rect x="680" y="40" width="300" height="300" rx="10" fill="#fbfcfd" stroke="#6b7378" stroke-width="1.4"/><text class="lab" x="694" y="66" style="font-size:17px">3. После Break H/V</text>
<text class="small" x="694" y="86" >горизонтали и вертикали в разные позиции</text>
<line x1="716.0" y1="290.0" x2="804.0" y2="290.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="716.0" cy="290.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="804.0" cy="290.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><line x1="810.0" y1="284.0" x2="810.0" y2="206.0" stroke="#e65100" stroke-width="5" stroke-linecap="round"/><circle cx="810.0" cy="284.0" r="4" fill="#fff" stroke="#e65100" stroke-width="1.6"/><circle cx="810.0" cy="206.0" r="4" fill="#fff" stroke="#e65100" stroke-width="1.6"/><line x1="816.0" y1="200.0" x2="904.0" y2="200.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="816.0" cy="200.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="904.0" cy="200.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><line x1="910.0" y1="194.0" x2="910.0" y2="126.0" stroke="#e65100" stroke-width="5" stroke-linecap="round"/><circle cx="910.0" cy="194.0" r="4" fill="#fff" stroke="#e65100" stroke-width="1.6"/><circle cx="910.0" cy="126.0" r="4" fill="#fff" stroke="#e65100" stroke-width="1.6"/><line x1="916.0" y1="120.0" x2="944.0" y2="120.0" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><circle cx="916.0" cy="120.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><circle cx="944.0" cy="120.0" r="4" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><rect x="694" y="300" width="14" height="10" fill="#2e7d32"/><text class="mono2" x="714" y="310" >bft - Horizontal  3 замера</text>
<rect x="694" y="318" width="14" height="10" fill="#e65100"/><text class="mono2" x="714" y="328" fill="#e65100">bft - Vertical  2 замера</text>
<line x1="322" y1="190" x2="348" y2="190" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/><line x1="652" y1="190" x2="678" y2="190" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/><text class="small" x="336" y="176" text-anchor="middle" >Break</text>
<text class="small" x="666" y="176" text-anchor="middle" >Break H/V</text>
<text class="note" x="20" y="372" >Break: выделенные Lines разбиваются на односегментные замеры, сумма LFT не меняется, Ctrl+Z возвращает.</text>
<text class="note" x="20" y="394" >Break H/V: то же, но горизонтальные и вертикальные сегменты уходят в две новые позиции рядом с исходной.</text>
<text class="small" x="20" y="416" >Повторный Break H/V доливает в уже созданную пару Horizontal / Vertical, новую не создаёт.</text>
</svg>
