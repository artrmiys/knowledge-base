<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
  <title id="t">Siding takeoff by elevation area</title>
  <desc id="d">House elevation: the wall field is one Area, the gable with another material is a separate Area, the garage door opening is cut out once, windows narrower than 4 feet are not deducted, trim is measured separately in LFT.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="599" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<line x1="30" y1="470" x2="520" y2="470" stroke="#3a3f44" stroke-width="1.4"/>
<path d="M60,470 V250 H480 V470 Z M300,470 V340 H440 V470 Z" fill="url(#hatchGreen)" stroke="#2e7d32" stroke-width="2.4" fill-rule="evenodd" stroke-linejoin="round"/>
<polygon points="60,250 270,110 480,250" fill="#fff3d6" stroke="#b7791f" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M96,250 L270,134 L444,250" fill="none" stroke="#b7791f" stroke-width="1" stroke-dasharray="3 5"/>
<polyline points="40,264 270,96 500,264" fill="none" stroke="#3a3f44" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="300" y="340" width="140" height="130" fill="#ffffff" stroke="#c62828" stroke-width="1.6" stroke-dasharray="7 4"/>
<line x1="300" y1="372" x2="440" y2="372" stroke="#c9ced3" stroke-width="1.2"/>
<line x1="300" y1="404" x2="440" y2="404" stroke="#c9ced3" stroke-width="1.2"/>
<line x1="300" y1="436" x2="440" y2="436" stroke="#c9ced3" stroke-width="1.2"/>
<line x1="300" y1="492" x2="440" y2="492" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="370.0" y="485.0" text-anchor="middle">9'-0"</text>
<rect x="110" y="300" width="44" height="70" fill="#dbeafe" stroke="#3a3f44" stroke-width="1.5"/>
<line x1="132.0" y1="300" x2="132.0" y2="370" stroke="#3a3f44" stroke-width="1"/>
<line x1="110" y1="335.0" x2="154" y2="335.0" stroke="#3a3f44" stroke-width="1"/>
<rect x="190" y="300" width="44" height="70" fill="#dbeafe" stroke="#3a3f44" stroke-width="1.5"/>
<line x1="212.0" y1="300" x2="212.0" y2="370" stroke="#3a3f44" stroke-width="1"/>
<line x1="190" y1="335.0" x2="234" y2="335.0" stroke="#3a3f44" stroke-width="1"/>
<line x1="110" y1="392" x2="154" y2="392" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="132" y="412" text-anchor="middle">3'-0"</text>
<rect x="240" y="180" width="60" height="44" fill="#dbeafe" stroke="#3a3f44" stroke-width="1.5"/>
<rect x="54" y="250" width="12" height="220" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3"/>
<rect x="474" y="250" width="12" height="220" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3"/>
<circle cx="230" cy="430" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="230" y="434.5">1</text>
<circle cx="330" cy="215" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="330" y="219.5">2</text>
<circle cx="370" cy="400" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="370" y="404.5">3</text>
<circle cx="172" cy="286" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="172" y="290.5">4</text>
<circle cx="60" cy="360" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="60" y="364.5">5</text>
<circle cx="550" cy="64" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="550" y="68.5">1</text>
<text class="lab2" x="570" y="69">Поле стены: Area</text>
<text class="mono2" x="570" y="87">siding/6" vertical | SQ FT</text>
<text class="mono2" x="570" y="104">итем на материал и цвет</text>
<circle cx="550" cy="138" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="550" y="142.5">2</text>
<text class="lab2" x="570" y="143">Gable с другим материалом</text>
<text class="mono2" x="570" y="161">siding/shingle gable | SQ FT</text>
<text class="mono2" x="570" y="178">отдельный полигон или итем</text>
<circle cx="550" cy="212" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="550" y="216.5">3</text>
<text class="lab2" x="570" y="217">Проём шире 4': вырезан</text>
<text class="note" x="570" y="235">отверстие в Area, один раз</text>
<text class="note" x="570" y="252">ворота гаража вычитаем всегда</text>
<circle cx="550" cy="286" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="550" y="290.5">4</text>
<text class="lab2" x="570" y="291">Окна уже 4': не вычитаем</text>
<text class="note" x="570" y="309">остаются в площади siding</text>
<circle cx="550" cy="360" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="550" y="364.5">5</text>
<text class="lab2" x="570" y="365">Trim и corner boards</text>
<text class="note" x="570" y="383">отдельно, LFT; в SQ FT не входят</text>
<rect x="40" y="520" width="800" height="60" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="inkb" x="56" y="545">Строка DFL:</text>
<text class="mono2" x="150" y="545">Siding Vertical | 1x6 Cedar | SQ FT | =Front+Rear+Left+Right</text>
<text class="ink" x="56" y="567">Масштаб фасада проверь по известному размеру: фасады часто в другом масштабе, чем планы.</text>
</svg>
