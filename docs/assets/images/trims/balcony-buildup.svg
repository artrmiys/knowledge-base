<text class="note" x="40" y="658">Decking =CEILING(W*D*units*1.1,10); Soffit =W*D*G;</text>
<text class="note" x="40" y="678">Trims =(W+2*D)*G; Flashing =W*G. Обычный балкон: decking</text>
<text class="note" x="40" y="698">2x6 DuxxBak прямо по joists, без 5 и 6.</text>
