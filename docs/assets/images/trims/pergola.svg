<rect x="210" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="251" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="292" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="333" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="374" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="415" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="456" y="180" width="18" height="18" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="392" y="240" width="28" height="190" fill="url(#endgrain)" stroke="#6c4b2a" stroke-width="1.5"/>
<polygon points="392,318 392,300 332,240 314,240" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="376" y="430" width="60" height="26" fill="url(#conc)" stroke="#6b7378" stroke-width="1.3"/>
<line x1="110" y1="430" x2="520" y2="430" stroke="#3a3f44" stroke-width="1.4"/>
<text class="note" x="200" y="422">grade</text>
<line x1="113" y1="150" x2="470" y2="150" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="291.5" y="143.0" text-anchor="middle">длина балки, в строке</text>
<line x1="470" y1="250" x2="470" y2="430" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="dimt" x="478" y="345.0">высота</text>
<circle cx="240" cy="219" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="240" y="223.5">1</text>
<circle cx="301" cy="189" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="301" y="193.5">2</text>
<circle cx="86" cy="218" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="86" y="222.5">3</text>
<circle cx="345" cy="290" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="345" y="294.5">4</text>
<circle cx="406" cy="350" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="406" y="354.5">5</text>
<circle cx="575" cy="110" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="114.5">1</text>
<text class="lab2" x="595" y="115">Балки с фигурным концом</text>
<text class="mono2" x="595" y="133">1E Shape | 4x10 Cedar</text>
<text class="mono2" x="595" y="150">pcs + длина</text>
<circle cx="575" cy="180" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="184.5">2</text>
<text class="lab2" x="595" y="185">Trellis, рейки поперёк</text>
<text class="mono2" x="595" y="203">Trellis | 3x3</text>
<text class="mono2" x="595" y="220">pcs + длина</text>
<circle cx="575" cy="250" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="254.5">3</text>
<text class="lab2" x="595" y="255">Ledger на стене</text>
<text class="mono2" x="595" y="273">Ledger | 2x4 | LFT</text>
<circle cx="575" cy="320" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="324.5">4</text>
<text class="lab2" x="595" y="325">Brackets</text>
<text class="mono2" x="595" y="343">Brackets | по детали | pcs</text>
<circle cx="575" cy="390" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="575" y="394.5">5</text>
<text class="lab2" x="595" y="395">Posts</text>
<text class="mono2" x="595" y="413">Posts | 4x4 или 6x6</text>
<text class="mono2" x="595" y="430">pcs + высота</text>
<text class="ink" x="40" y="488">Pergola пишем по элементам, не одной строкой. Нет детали: размеры по elevation, в E assumed.</text>
</svg>
