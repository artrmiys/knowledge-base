<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
  <title id="t">C_TrimsCalc before and after</title>
  <desc id="d">Excel mock: rows of the trim of one window with an EA quantity row below are selected in three columns; two rows under the selection the macro writes a table of labels with formulas that multiply each value by the quantity.</desc>
