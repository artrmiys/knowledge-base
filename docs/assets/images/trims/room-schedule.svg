<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
  <title id="t">How to read a room finish schedule for base and crown</title>
  <desc id="d">Mock room finish schedule with columns Room, Floor, Base, Walls, Ceiling, Remarks. Base cells are coloured: wood base is counted, tile and rubber are not, TBD needs a note. Remarks with crown drive the Crown row. Notes on the right say what to do with each room.</desc>
