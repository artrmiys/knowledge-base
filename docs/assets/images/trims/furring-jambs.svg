<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d">
  <title id="t">Plan section at a window jamb: wall layers, furring, jamb extension and exterior casing</title>
  <desc id="d">Horizontal section through an exterior wall at the side of a window: gypsum, 2x6 studs with king and jack studs, sheathing, WRB, 1x4 P.T. furring, 5/4x4 blocking around the opening, siding, window unit, 2x8 jamb extension and exterior casing. Numbered legend with DFL lines.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#2e7d32"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="gyp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#eef0f2"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    
    <style>
      .ln{fill:none;stroke:#3a3f44;stroke-width:1.6;stroke-linejoin:round}
      .thin{fill:none;stroke:#3a3f44;stroke-width:1.1}
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .small{font:400 12.5px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 13px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .lead{stroke:#2e7d32;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .leadInk{stroke:#3a3f44;stroke-width:1.3;fill:none;marker-end:url(#arrInk)}
      .leadRed{stroke:#c62828;stroke-width:1.5;fill:none;marker-end:url(#arrRed)}
      .dim{stroke:#3a3f44;stroke-width:1.1;fill:none;marker-start:url(#tick);marker-end:url(#tick)}
      .dimt{font:500 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numc{fill:#2e7d32;stroke:#fff;stroke-width:1.5}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .h{font:700 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .cap{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="579" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<rect x="60" y="110" width="278" height="14" fill="#eef0f2" stroke="#9aa4ad" stroke-width="1.2" />
<rect x="60" y="124" width="270" height="100" fill="url(#batt)" stroke="#caa64a" stroke-width="1" />
<rect x="100" y="124" width="25" height="100" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3" />
<rect x="240" y="124" width="25" height="100" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3" />
<rect x="280" y="124" width="25" height="100" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4" />
<rect x="305" y="124" width="25" height="100" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.4" />
<rect x="60" y="224" width="270" height="14" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.3" />
<rect x="60" y="238" width="270" height="5" fill="#d9f2d8" stroke="#2e7d32" stroke-width="1" />
<rect x="100" y="243" width="25" height="18" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="240" y="243" width="25" height="18" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.3" />
<rect x="267" y="243" width="63" height="18" fill="url(#pt)" stroke="#6c4b2a" stroke-width="1.4" />
<rect x="60" y="261" width="270" height="14" fill="#d7c3a6" stroke="#8a6a3f" stroke-width="1.3" />
<rect x="338" y="190" width="302" height="50" fill="#ffffff" stroke="#3a3f44" stroke-width="1.6" />
<rect x="350" y="200" width="290" height="30" fill="#dbeafe" stroke="#5b7fa6" stroke-width="1.2" />
<line x1="338" y1="238" x2="330" y2="238" stroke="#3a3f44" stroke-width="3"/><rect x="330" y="190" width="27" height="85" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.6" />
<rect x="270" y="275" width="87" height="20" fill="#efe3cc" stroke="#8a6a3f" stroke-width="1.4" />
<line class="dim" x1="380" y1="190" x2="380" y2="275"/>
<text class="dimt" x="380" y="232.5" text-anchor="middle" ></text>
<text class="dimt" x="392" y="300" >глубина от рамы до siding</text>
<text class="dimt" x="392" y="318" >= размер jamb: 2x4 / 2x8 / 2x10</text>
<line class="dim" x1="112" y1="330" x2="252" y2="330"/>
<text class="dimt" x="182" y="344" text-anchor="middle" >16" o.c.</text>
<text class="side" x="40" y="90" >INT</text>
<text class="side" x="40" y="300" >EXT</text>
<text class="side" x="380" y="150" >opening (вид сверху)</text>
<circle class="numc" cx="200" cy="117" r="11"/><text class="numt" x="200" y="121.5">1</text>
<circle class="numc" cx="317" cy="152" r="11"/><text class="numt" x="317" y="156.5">2</text>
<circle class="numc" cx="495" cy="215" r="11"/><text class="numt" x="495" y="219.5">3</text>
<circle class="numc" cx="343" cy="207" r="11"/><text class="numt" x="343" y="211.5">4</text>
<circle class="numc" cx="200" cy="231" r="11"/><text class="numt" x="200" y="235.5">5</text>
<circle class="numc" cx="112" cy="252" r="11"/><text class="numt" x="112" y="256.5">7</text>
<circle class="numc" cx="298" cy="252" r="11"/><text class="numt" x="298" y="256.5">8</text>
<circle class="numc" cx="200" cy="268" r="11"/><text class="numt" x="200" y="272.5">9</text>
<circle class="numc" cx="313" cy="285" r="11"/><text class="numt" x="313" y="289.5">10</text>
<line class="lead" x1="70" y1="350" x2="90" y2="241"/>
<text class="small" x="60" y="366" >WRB (6)</text>
<circle class="numc" cx="701" cy="57" r="11"/><text class="numt" x="701" y="61.5">1</text>
<text class="lab2" x="720" y="62" >Gypsum</text>
<text class="red" x="720" y="79" >by others, не считаем</text>
<circle class="numc" cx="701" cy="105" r="11"/><text class="numt" x="701" y="109.5">2</text>
<text class="lab2" x="720" y="110" >Studs 2x6, king + jack у проёма</text>
<text class="note" x="720" y="127" >в строке стены</text>
<circle class="numc" cx="701" cy="153" r="11"/><text class="numt" x="701" y="157.5">3</text>
<text class="lab2" x="720" y="158" >Window unit</text>
<text class="note" x="720" y="175" >страница Openings</text>
<circle class="numc" cx="701" cy="201" r="11"/><text class="numt" x="701" y="205.5">4</text>
<text class="lab2" x="720" y="206" >Window jamb 2x8 (по глубине стены)</text>
<text class="mono" x="720" y="223" >Window Jamb | 2x8 | LFT, 3 стороны</text>
<circle class="numc" cx="701" cy="249" r="11"/><text class="numt" x="701" y="253.5">5</text>
<text class="lab2" x="720" y="254" >Sheathing</text>
<text class="note" x="720" y="271" >страница Wall Sheathing</text>
<circle class="numc" cx="701" cy="297" r="11"/><text class="numt" x="701" y="301.5">6</text>
<text class="lab2" x="720" y="302" >WRB</text>
<text class="note" x="720" y="319" >строка, если scope просит</text>
<circle class="numc" cx="701" cy="345" r="11"/><text class="numt" x="701" y="349.5">7</text>
<text class="lab2" x="720" y="350" >Furring 1x4 P.T. @ 16" o.c.</text>
<text class="mono" x="720" y="367" >Furring | 1x4 P.T. | LFT / SQ FT</text>
<circle class="numc" cx="701" cy="393" r="11"/><text class="numt" x="701" y="397.5">8</text>
<text class="lab2" x="720" y="398" >Blocking around openings</text>
<text class="mono" x="720" y="415" >Blocking | 5/4x4 P.T. | LFT</text>
<circle class="numc" cx="701" cy="441" r="11"/><text class="numt" x="701" y="445.5">9</text>
<text class="lab2" x="720" y="446" >Siding</text>
<text class="note" x="720" y="463" >страница Siding</text>
<circle class="numc" cx="701" cy="489" r="11"/><text class="numt" x="701" y="493.5">10</text>
<text class="lab2" x="720" y="494" >Exterior casing</text>
<text class="mono" x="720" y="511" >Casing | LFT (Exterior Trims)</text>
<text class="lab2" x="60" y="420" >Jamb и Blocking around openings - две разные строки:</text>
<text class="note" x="60" y="440" >jamb добирает глубину проёма по детали, blocking = nailer под casing и flashing.</text>
<text class="note" x="60" y="470" >Size jamb из wall section, не угадывать: тонкая стена 2x4, толстая (furring + EIFS) 2x8 / 2x10.</text>
<text class="note" x="60" y="500" >P.T. внизу и во влажных зонах, выше не P.T.: разные строки. Не путать с interior casing.</text>
<text class="mono2" x="60" y="540" >Quantity = периметр проёма (2 jambs + head, 4 стороны если есть sill) x число окон этого типа.</text>
</svg>
