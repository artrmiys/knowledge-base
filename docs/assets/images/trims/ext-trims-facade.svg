<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
  <title id="t">Exterior trim groups on a facade</title>
  <desc id="d">House elevation with the exterior trim groups numbered: window casing, head crown, window sill, corner boards, watertable trim, frieze board, eave soffit, fascia, shutters and porch columns. The list on the right gives the DFL label and unit of each.</desc>
