<rect x="442" y="143" width="18" height="110" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="40" y="253" width="420" height="9" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
