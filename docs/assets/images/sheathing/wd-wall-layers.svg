<text class="red" x="530" y="399">by others, не считаем</text>
<circle cx="510" cy="440" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="510" y="444.5">7</text>
<text class="lab2" x="530" y="445">Внутренний gypsum</text>
<text class="red" x="530" y="463">by others, не считаем</text>
<rect x="40" y="330" width="420" height="120" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="ink" x="56" y="356">Слои считай по стрелкам детали и wall type:</text>
<text class="ink" x="56" y="378">1 слой, (2) layers, over FRT это разные строки.</text>
<text class="ink" x="56" y="400">Gypsum в SQ FT, структурный ply в 4x8.</text>
<text class="ink" x="56" y="422">Два слоя: Wall Sheathing (2) layers.</text>
</svg>
