<circle cx="240" cy="81" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="240" y="85.5">1</text>
<circle cx="100" cy="115" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="100" y="119.5">2</text>
<circle cx="180" cy="123" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="180" y="127.5">3</text>
<circle cx="300" cy="136" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="300" y="140.5">4</text>
<circle cx="220" cy="198" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="220" y="202.5">5</text>
<circle cx="300" cy="198" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="300" y="202.5">6</text>
<circle cx="400" cy="262" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="400" y="266.5">7</text>
<circle cx="510" cy="56" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="510" y="60.5">1</text>
<text class="lab2" x="530" y="61">Brick / masonry veneer, ties</text>
<text class="red" x="530" y="79">by others, не считаем</text>
