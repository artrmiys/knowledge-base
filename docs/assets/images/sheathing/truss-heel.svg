<text class="note" x="560" y="327">страница Eve</text>
<circle cx="540" cy="366" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="540" y="370.5">6</text>
<text class="lab2" x="560" y="371">Roof truss</text>
<text class="red" x="560" y="389">by others, не считаем</text>
<text class="ink" x="540" y="440">Имя в дереве, Line вдоль eave-стен:</text>
<text class="mono" x="540" y="462">trussheel 1.58</text>
<text class="ink" x="540" y="484">С Zip своя строка Tape, LFT.</text>
<rect x="40" y="540" width="800" height="62" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="ink" x="56" y="565">Heel только на eave-сторонах: на rake-сторонах эта полоса уже в треугольнике gable.</text>
<text class="ink" x="56" y="587">Число в имени это высота пятки в футах. Не путать с выносом eve (дюймы).</text>
