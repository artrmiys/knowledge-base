<rect x="276" y="396" width="504" height="24" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.1" stroke-dasharray="4 3"/>
<rect x="420" y="306" width="14" height="90" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.1" stroke-dasharray="4 3"/>
<polygon points="276.0,378.0 780.0,126.0 769.3,104.5 265.3,356.5" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="4 3"/>
<polygon points="265.3,356.5 769.3,104.5 765.7,97.4 261.7,349.4" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2" stroke-linejoin="round" />
<rect x="412" y="300" width="8" height="120" fill="#00897b" stroke="#00897b" stroke-width="1.6" fill-opacity="0.8"/>
<rect x="266" y="376" width="10" height="60" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3" />
<rect x="260" y="374" width="6" height="64" fill="#f7f3ea" stroke="#8a6a3f" stroke-width="1.2" />
<rect x="266" y="420" width="146" height="6" fill="#f3e9d2" stroke="#8a6a3f" stroke-width="1.1" />
<line class="dim" x1="490" y1="420" x2="490" y2="306"/>
<text class="dimt" x="490" y="363" text-anchor="middle" ></text>
<text class="lab2" x="502" y="359" >heel 1'-7"</text>
<text class="mono2" x="502" y="377" >= 1.58 ft</text>
<line class="dim" x1="276" y1="460" x2="420" y2="460"/>
<text class="dimt" x="348" y="474" text-anchor="middle" >overhang 24"</text>
<text class="side" x="250" y="530" >EXT</text>
<text class="side" x="470" y="530" >INT</text>
<line class="lead" x1="688" y1="110" x2="620" y2="196"/>
<text class="lab2" x="700" y="106" >Roof sheathing</text>
<text class="small" x="700" y="124" >страница Roof Sheathing</text>
<line class="lead" x1="688" y1="200" x2="480" y2="278"/>
<text class="note" x="700" y="196" >Top chord, truss by others</text>
<line class="lead" x1="688" y1="300" x2="440" y2="360"/>
<text class="note" x="700" y="296" >Heel web</text>
<line class="lead" x1="240" y1="250" x2="414" y2="363"/>
<text class="lab" x="50" y="236" >Truss heel sheathing</text>
<text class="mono2" x="50" y="255" >Truss Heel | 1/2" OSB | SQ FT</text>
<text class="small" x="50" y="273" >= LFT карниза x высота пятки</text>
<text class="mono2" x="50" y="291" >trussheel 1.58 | Line</text>
<line class="lead" x1="200" y1="372" x2="258" y2="408"/>
<text class="note" x="50" y="350" >Sub-fascia 2x8, fascia 1x8</text>
<text class="small" x="50" y="368" >страница Eve</text>
<line class="lead" x1="200" y1="500" x2="410" y2="500"/>
<text class="note" x="50" y="496" >Wall sheathing / Zip</text>
<text class="small" x="50" y="514" >в строке стены, не heel</text>
<text class="lab" x="60" y="50" >Raised heel у карниза (eave side)</text>
<text class="note" x="60" y="70" >высота пятки с детали карниза или из truss package</text>
<text class="note" x="60" y="556" >Heel только на eave-сторонах; на rake-сторонах полоса = gable. Высоту пятки не путать с выносом eve (дюймы).</text>
</svg>
