<text class="small" x="442" y="264" >кровли внутри</text>
<line class="dim" x1="320" y1="140" x2="373" y2="140"/>
<text class="dimt" x="346.5" y="128" text-anchor="middle" >Wtop</text>
<text class="side" x="240" y="470" >EXT</text>
<text class="side" x="400" y="470" >INT</text>
<line class="lead" x1="548" y1="100" x2="383" y2="160"/>
<text class="lab2" x="560" y="96" >Cap / coping + flashing</text>
<text class="mono" x="560" y="114" >Parapet Cap | LFT</text>
<line class="lead" x1="548" y1="160" x2="373" y2="172"/>
