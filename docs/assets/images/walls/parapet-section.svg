<text class="mono" x="560" y="234" >Sheathing int | Hin x LFT</text>
<line class="lead" x1="548" y1="360" x2="443" y2="312"/>
<text class="note" x="560" y="356" >Roof deck + мембрана наверх</text>
<text class="red" x="560" y="374" >кровля by others</text>
<line class="lead" x1="548" y1="420" x2="367" y2="400"/>
<text class="lab2" x="560" y="416" >Blocking между фермами над стеной</text>
<text class="mono" x="560" y="434" >Blocking | 2x6 | LFT</text>
<line class="lead" x1="548" y1="480" x2="403" y2="428"/>
