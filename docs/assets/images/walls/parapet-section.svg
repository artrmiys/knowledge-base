<line class="lead" x1="130" y1="240" x2="320" y2="240"/>
<text class="lab2" x="60" y="220" >Наружная плоскость</text>
<text class="small" x="60" y="238" >от top plate</text>
<text class="mono" x="60" y="256" style="font-size:12.5px">Sheathing ext | Hout x LFT</text>
<line class="lead" x1="130" y1="400" x2="328" y2="380"/>
<text class="lab2" x="60" y="396" >Studs парапета</text>
<text class="small" x="60" y="414" >по высоте Hout</text>
<rect x="60" y="560" width="880" height="90" rx="8" fill="#f4faf4" stroke="#2e7d32" stroke-width="1.2"/><text class="lab2" x="76" y="586" >Имя позиции:  prpt &lt;Hout&gt; &lt;Hin&gt; &lt;Wtop&gt; &lt;деталь или зона&gt;,  числа в футах, Line по длине парапета</text>
<text class="mono" x="76" y="610" style="font-size:16px">prpt 3.4 3 2 2/S405      prpt 6.4 5.3 0.5 par</text>
<text class="small" x="76" y="634" >Макрос A4_Parapet читает три числа с хвоста имени; нулевой Wtop экспорт заменяет на 0.66 (особенность экспорта).</text>
</svg>
