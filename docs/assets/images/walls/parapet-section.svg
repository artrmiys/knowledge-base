<polygon points="363.0,350.0 783.0,338.0 783.0,314.0 363.0,326.0" fill="#f4e9d7" stroke="#8a6a3f" stroke-width="1.0" stroke-linejoin="round" stroke-dasharray="4 3"/>
<polygon points="363.0,326.0 783.0,314.0 783.0,304.0 363.0,316.0" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2" stroke-linejoin="round" />
<rect x="330" y="350" width="33" height="90" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.5" />
<rect x="322" y="440" width="8" height="200" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2" />
<rect x="322" y="176" width="8" height="264" fill="url(#sheath)" stroke="#2e7d32" stroke-width="2.2" />
<rect x="363" y="176" width="8" height="140" fill="url(#sheath)" stroke="#2e7d32" stroke-width="2.2" />
<rect x="320" y="168" width="53" height="8" fill="url(#sheath)" stroke="#2e7d32" stroke-width="2.2" />
<path d="M423,315 H373 V184" fill="none" stroke="#333" stroke-width="3"/><path d="M310,172 V158 H385 V172" fill="none" stroke="#4d5861" stroke-width="3.5"/><line class="dim" x1="262" y1="440" x2="262" y2="168"/>
<text class="dimt" x="262" y="304" text-anchor="middle" ></text>
<text class="lab" x="250" y="300" text-anchor="end" >Hout</text>
<text class="small" x="250" y="318" text-anchor="end" >от top plate</text>
<text class="small" x="250" y="334" text-anchor="end" >снаружи</text>
<line class="dim" x1="430" y1="316" x2="430" y2="168"/>
<text class="dimt" x="430" y="242" text-anchor="middle" ></text>
<text class="lab" x="442" y="230" >Hin</text>
