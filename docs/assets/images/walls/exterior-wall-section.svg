<text class="dimt" x="340" y="126" text-anchor="middle">TJI 11 7/8"</text>
<text class="dimt" x="340" y="70" text-anchor="middle">subfloor 3/4"</text>
<rect x="200" y="150" width="50" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="162" width="50" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="174" width="50" height="264" fill="url(#batt)" stroke="#caa64a" stroke-width="1"/>
<rect x="200" y="174" width="50" height="264" fill="none" stroke="#3a3f44" stroke-width="1.4"/>
<rect x="200" y="438" width="50" height="12" fill="url(#wood)" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="250" y="174" width="8" height="276" fill="#eef0f2" stroke="#8a98a5" stroke-width="1.1"/>
<rect x="200" y="450" width="240" height="10" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<rect x="212" y="460" width="228" height="50" fill="#eedec3" stroke="#8a6a3f" stroke-width="1.3"/>
<rect x="200" y="460" width="12" height="50" fill="url(#endgrain)" stroke="#8a6a3f" stroke-width="1.3"/>
<path d="M440,80 V150 M440,450 V510" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
<path d="M440,78 l-5,12 l10,14 l-10,14 l10,14 l-5,18 M440,448 l-5,12 l10,14 l-10,14 l10,14 l-5,10" fill="none" stroke="#3a3f44" stroke-width="1.1" stroke-linejoin="round"/>
<rect x="188" y="30" width="12" height="480" fill="url(#sheath)" stroke="#7a6a3c" stroke-width="1.2"/>
<line x1="184.5" y1="30" x2="184.5" y2="510" stroke="#2e7d32" stroke-width="3"/>
<line x1="130" y1="150" x2="130" y2="450" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="lab" x="118" y="292" text-anchor="end">8.45'</text>
<text class="note" x="118" y="312" text-anchor="end">высота стены</text>
<text class="note" x="118" y="330" text-anchor="end">с plates</text>
<line x1="140" y1="150" x2="196" y2="150" stroke="#3a3f44" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="140" y1="450" x2="196" y2="450" stroke="#3a3f44" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="480" y1="80" x2="480" y2="450" stroke="#3a3f44" stroke-width="1.1" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text class="lab" x="490" y="262">9'-6"</text>
<text class="note" x="490" y="282">floor to</text>
<text class="note" x="490" y="300">floor</text>
<line x1="444" y1="80" x2="474" y2="80" stroke="#3a3f44" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="444" y1="450" x2="474" y2="450" stroke="#3a3f44" stroke-width="0.9" stroke-dasharray="3 3"/>
<text class="side" x="100" y="500" text-anchor="middle">EXT</text>
<text class="side" x="330" y="420" text-anchor="middle">INT</text>
<circle cx="225" cy="300" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="225" y="304.5">1</text>
<circle cx="225" cy="444" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="225" y="448.5">2</text>
<circle cx="225" cy="162" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="225" y="166.5">3</text>
<circle cx="194" cy="230" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="194" y="234.5">4</text>
<circle cx="184" cy="380" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="184" y="384.5">5</text>
<circle cx="300" cy="476" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="300" y="480.5">6</text>
<circle cx="254" cy="350" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="254" y="354.5">7</text>
<circle cx="580" cy="52" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="56.5">1</text>
<text class="lab2" x="600" y="57">Studs</text>
<text class="mono2" x="600" y="75">Studs Ext | 2x6 | pcs</text>
<text class="mono2" x="600" y="92">высота стены в колонке E</text>
<circle cx="580" cy="118" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="122.5">2</text>
<text class="lab2" x="600" y="123">Bottom plate</text>
<text class="mono2" x="600" y="141">Plates Ext (1) btm | LFT</text>
<text class="mono2" x="600" y="158">P.T. только на бетоне</text>
<circle cx="580" cy="184" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="188.5">3</text>
<text class="lab2" x="600" y="189">Double top plate</text>
<text class="mono2" x="600" y="207">Plates Ext (2) dbl top | LFT</text>
<circle cx="580" cy="250" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="254.5">4</text>
<text class="lab2" x="600" y="255">Sheathing</text>
<text class="mono2" x="600" y="273">Wall Sheathing | 4x8</text>
<circle cx="580" cy="316" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="320.5">5</text>
<text class="lab2" x="600" y="321">WRB по спецификации</text>
<text class="mono2" x="600" y="339">Vapor Barrier | SQ FT</text>
<text class="mono2" x="600" y="356">при Zip: только Tape</text>
<circle cx="580" cy="382" r="11" fill="#8a98a5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="386.5">6</text>
<text class="lab2" x="600" y="387">Rim, joists, subfloor</text>
<text class="note" x="600" y="405">перекрытие: свои страницы</text>
<circle cx="580" cy="448" r="11" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text class="numt" x="580" y="452.5">7</text>
<text class="lab2" x="600" y="453">Gypsum, batt между стойками</text>
<text class="red" x="600" y="471">by others, не считаем</text>
<rect x="40" y="536" width="800" height="84" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2" rx="8"/>
<text class="inkb" x="56" y="562">Высота в имени = floor-to-floor - subfloor - глубина перекрытия. Plates не вычитаем.</text>
<text class="mono2" x="56" y="585">9'-6" - 3/4" - 11 7/8" = 8.45'</text>
<text class="ink" x="330" y="585">имя стены:</text>
<text class="mono" x="410" y="585">ext 2x6 8.45</text>
<text class="ink" x="56" y="607">Это не floor-to-floor и не отметка потолка. Читай разрез каждого дома.</text>
</svg>
