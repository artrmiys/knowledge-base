<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 664" role="img" aria-labelledby="t d">
  <title id="t">Corridor wall section: staggered 2x4 studs on 2x6 plates, ledger and corridor joists</title>
  <desc id="d">Section through a fire-rated corridor wall on the 1st floor slab: P.T. 2x6 bottom plate, two rows of 2x4 studs at 16 inch on center staggered on the 2x6 plates, double 2x6 top plate, temporary 2x4 bracing. Above it the unit floor trusses bear on the wall, a 2x10 ledger is screwed to the rim on the corridor side and the 2x10 corridor joists hang on it in hangers. Gypsum and batt are by others. Numbers match the DFL rows in the legend. Below, the plan: one Line along the wall axis named corr 2x6 9.09.</desc>
