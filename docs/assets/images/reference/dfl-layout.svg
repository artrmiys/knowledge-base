<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" role="img" aria-labelledby="t d">
  <title id="t">Zones of the Detailed Frame List sheet</title>
  <desc id="d">Top: the delivered table A:H with sample rows (plates from the wall matrix, a ledger linked to the OurPlanCore export, a yellow note row) and the export block J:N; a dashed arrow shows that G takes its number from K. Rows are inserted only inside A:H with a shift. Below: what each column A to H holds, and the work zones right of H that never reach the client: J:N export, O:AB wall matrix, spec cells O2:P8 and R2:S7, AE:AV height calculator, AW:BH hanger and steel references, BR row notes.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <style>
      .zone{font:700 17px Inter, "Segoe UI", Arial, sans-serif}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .colh{font:700 14px Inter, "Segoe UI", Arial, sans-serif}
      .cell{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .cellb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .rule{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .key{font:700 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .code{font:700 14px "JetBrains Mono", Consolas, monospace;fill:#3a3f44}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab3{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
    </style>
  </defs>
