<path d="M567.0,134 V230 H782.0 V138" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="540" y="112" width="54" height="22" rx="3" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
<rect x="766" y="112" width="32" height="22" rx="3" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
<text class="green" x="674.5" y="250" text-anchor="middle">G берёт число из K: замер из OurPlanCore</text>
<text class="rule" x="40" y="282">Строки вставлять только в A:H со сдвигом (Ctrl+W), не целой строкой листа</text>
<text class="key" x="40" y="312">A</text><text class="ink" x="62" y="312">Description: подпись как в шаблоне</text>
<text class="key" x="40" y="335">B</text><text class="ink" x="62" y="335">Size / spec: сечение, продукт, модель</text>
<text class="key" x="40" y="358">C</text><text class="ink" x="62" y="358">Qty: всегда формула от G и H</text>
<text class="key" x="40" y="381">D</text><text class="ink" x="62" y="381">Unit: LFT, SQ FT, 4x8, pcs или длина доски</text>
<text class="key" x="470" y="312">E</text><text class="ink" x="492" y="312">Source: марка или лист и деталь</text>
<text class="key" x="470" y="335">F</text><text class="ink" x="492" y="335">Tags: марки стен, итоги</text>
<text class="key" x="470" y="358">G</text><text class="ink" x="492" y="358">Замер: =K из J:N или матрица O:AB</text>
<text class="key" x="470" y="381">H</text><text class="ink" x="492" y="381">Параметр формулы: шаг, plies, высота</text>
<line x1="40" y1="410" x2="840" y2="410" stroke="#e3e7ea" stroke-width="1"/>
<text class="lab2" x="40" y="438">Рабочие зоны правее H: клиенту не уходят</text>
<rect x="40" y="455" width="40" height="21" rx="4" fill="#eceff1" stroke="#b0b8bf" stroke-width="1"/>
<text class="code" x="47" y="470">J:N</text>
<text class="lab3" x="166" y="470">экспорт OurPlanCore</text>
<text class="ink" x="336" y="470">J имя, K число, L единица, M флаги (r, rb, b48, h16, l, bd, bft)</text>
<rect x="40" y="480" width="48" height="21" rx="4" fill="#eceff1" stroke="#b0b8bf" stroke-width="1"/>
<text class="code" x="47" y="495">O:AB</text>
<text class="lab3" x="166" y="495">матрица стен</text>
<text class="ink" x="336" y="495">LFT по типу стены и этажу, заполняет макрос A3 из J:N</text>
<rect x="40" y="505" width="117" height="21" rx="4" fill="#eceff1" stroke="#b0b8bf" stroke-width="1"/>
<text class="code" x="47" y="520">O2:P8, R2:S7</text>
<text class="lab3" x="166" y="520">спек-ячейки</text>
<text class="ink" x="336" y="520">обшивка, WRB, кровля и лист-источник</text>
<rect x="40" y="530" width="57" height="21" rx="4" fill="#eceff1" stroke="#b0b8bf" stroke-width="1"/>
<text class="code" x="47" y="545">AE:AV</text>
<text class="lab3" x="166" y="545">калькулятор высот</text>
<text class="ink" x="336" y="545">этаж, глубина фермы, вычеты, итоговая высота стойки</text>
<rect x="40" y="555" width="57" height="21" rx="4" fill="#eceff1" stroke="#b0b8bf" stroke-width="1"/>
<text class="code" x="47" y="570">AW:BH</text>
<text class="lab3" x="166" y="570">справочники</text>
<text class="ink" x="336" y="570">joist и балка к модели hanger; стальная балка к перемычке</text>
<rect x="40" y="580" width="31" height="21" rx="4" fill="#eceff1" stroke="#b0b8bf" stroke-width="1"/>
<text class="code" x="47" y="595">BR</text>
<text class="lab3" x="166" y="595">построчные ноты</text>
<text class="ink" x="336" y="595">допущения и флаги по строке</text>
<rect x="40" y="612" width="26" height="18" rx="3" fill="#e2efda" stroke="#9fbf8f" stroke-width="1.2"/>
<text class="ink" x="76" y="626">сдаётся (processed xlsx)</text>
<rect x="290" y="612" width="26" height="18" rx="3" fill="#eceff1" stroke="#b0b8bf" stroke-width="1.2"/>
<text class="ink" x="326" y="626">рабочее, клиенту не уходит</text>
<rect x="560" y="612" width="26" height="18" rx="3" fill="#ffff00" stroke="#c9c900" stroke-width="1.2"/>
<text class="ink" x="596" y="626">нота</text>
</svg>
