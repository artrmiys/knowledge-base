<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="t d">
  <title id="t">Path of the workbook through the E-Wood tab</title>
  <desc id="d">Top row: five steps that work on the open workbook, from takeoffs in J:L through rows and blocks, Sort Blocks, Notes + Look to Check. Sort Blocks and Notes + Look first put a copy into _ewood_backups. Bottom row: Fix Numbers, Fix Links, Merge DFL and Process Excels write copies into their own folders and leave the workbook unchanged; the processed_excels file is the one delivered.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#2e7d32"/></marker>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#c62828"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#8a98a5"/></marker>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M4,0 L4,8" stroke="#3a3f44" stroke-width="1.4"/></marker>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e9d3b0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a6a3f" stroke-width="0.9" opacity="0.55"/></pattern>
    <pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#cfa26a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6c4b2a" stroke-width="1" opacity="0.6"/></pattern>
    <pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#cfd4d8"/><circle cx="2.5" cy="2.5" r="1" fill="#6b7378" opacity="0.7"/><circle cx="7" cy="6.5" r="1" fill="#6b7378" opacity="0.7"/></pattern>
    <pattern id="sheath" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c9b27c"/><circle cx="2" cy="2" r="0.8" fill="#7a6a3c" opacity="0.6"/><circle cx="5" cy="5" r="0.8" fill="#7a6a3c" opacity="0.6"/></pattern>
    <pattern id="batt" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#fdf6e3"/><path d="M0,8 Q5,0 10,8 T20,8" fill="none" stroke="#caa64a" stroke-width="1.2"/></pattern>
    <pattern id="rigid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe9c6"/><path d="M0,8 L8,0" stroke="#d9a441" stroke-width="0.8"/></pattern>
    <pattern id="cmu" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#cfd4d8"/><path d="M0,10 H40 M20,0 V10 M0,10 V20 M40,10 V20" stroke="#6b7378" stroke-width="1" fill="none"/></pattern>
    <pattern id="endgrain" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9d3b0"/><path d="M0,3 H6" stroke="#8a6a3f" stroke-width="0.7" opacity="0.5"/></pattern>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.2" opacity="0.6"/></pattern>
    <pattern id="hatchGrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4ad" stroke-width="1" opacity="0.8"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5ea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.1" opacity="0.55"/></pattern>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .lab2{font:600 15px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .h{font:700 17px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#4b5563}
      .ink{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .inkb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .mono{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#2e7d32}
      .mono2{font:500 14px "JetBrains Mono", Consolas, monospace;fill:#1f2a1f}
      .side{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#8a98a5;letter-spacing:1px}
      .red{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#c62828}
      .green{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#2e7d32}
      .dimt{font:500 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .numt{font:700 13px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .xl{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlb{font:700 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2328}
      .xlh{font:400 13px Inter, "Segoe UI", Arial, sans-serif;fill:#5a6168}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="439" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<text class="side" x="26" y="38">ОТКРЫТАЯ КНИГА: КНОПКИ МЕНЯЮТ ЕЁ НА МЕСТЕ</text>
<rect x="26" y="54" width="156" height="96" fill="#f6f8f6" stroke="#8a98a5" stroke-width="1.8" rx="8"/>
<circle cx="46" cy="76" r="11" fill="#6b7378" stroke="#fff" stroke-width="1.5"/><text class="numt" x="46" y="80.5">1</text>
<text class="lab2" x="64" y="81">Замеры в J:L</text>
<text class="note" x="38" y="108">OurPlanCore пишет,</text>
<text class="note" x="38" y="127">A-макросы считают</text>
<line x1="183" y1="102.0" x2="193" y2="102.0" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="194" y="54" width="156" height="96" fill="#f6f8f6" stroke="#8a98a5" stroke-width="1.8" rx="8"/>
<circle cx="214" cy="76" r="11" fill="#6b7378" stroke="#fff" stroke-width="1.5"/><text class="numt" x="214" y="80.5">2</text>
<text class="lab2" x="232" y="81">Строки, блоки</text>
<text class="note" x="206" y="108">Structure, Insert,</text>
<text class="note" x="206" y="127">Duplicate Block</text>
<line x1="351" y1="102.0" x2="361" y2="102.0" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="362" y="54" width="156" height="96" fill="#dff2df" stroke="#2e7d32" stroke-width="1.8" rx="8"/>
<circle cx="382" cy="76" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="382" y="80.5">3</text>
<text class="lab2" x="400" y="81">Sort Blocks</text>
<text class="note" x="374" y="108">блоки к этажу,</text>
<text class="note" x="374" y="127">порядок стройки</text>
<line x1="519" y1="102.0" x2="529" y2="102.0" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="530" y="54" width="156" height="96" fill="#dff2df" stroke="#2e7d32" stroke-width="1.8" rx="8"/>
<circle cx="550" cy="76" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="550" y="80.5">4</text>
<text class="lab2" x="568" y="81">Notes + Look</text>
<text class="note" x="542" y="108">ноты, цвета,</text>
<text class="note" x="542" y="127">сетка, формулы</text>
<line x1="687" y1="102.0" x2="697" y2="102.0" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="698" y="54" width="156" height="96" fill="#ffffff" stroke="#2e7d32" stroke-width="1.8" rx="8" stroke-dasharray="6 4"/>
<circle cx="718" cy="76" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="718" y="80.5">5</text>
<text class="lab2" x="736" y="81">Check</text>
<text class="note" x="710" y="108">список замечаний,</text>
<text class="note" x="710" y="127">книга не меняется</text>
<path d="M440.0,150 v14 M608.0,150 v14" fill="none" stroke="#8a98a5" stroke-width="1.3" stroke-linejoin="round"/>
<rect x="362" y="164" width="324" height="56" fill="#fff8e1" stroke="#d9a441" stroke-width="1.2" rx="8"/>
<text class="ink" x="374" y="187">до изменений: копия в _ewood_backups,</text>
<text class="ink" x="374" y="206">закрыть без сохранения = отмена</text>
<text class="side" x="26" y="262">ФАЙЛ НА ДИСКЕ: КНОПКИ ДЕЛАЮТ КОПИЮ, КНИГА НЕ МЕНЯЕТСЯ</text>
<path d="M776.0,150 V280 H125.0" fill="none" stroke="#3a3f44" stroke-width="1.3" stroke-linejoin="round"/>
<line x1="125.0" y1="280" x2="125.0" y2="299" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="26" y="300" width="198" height="110" fill="#dbeafe" stroke="#1e88e5" stroke-width="1.6" rx="8"/>
<circle cx="46" cy="322" r="11" fill="#1e88e5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="46" y="326.5">6</text>
<text class="lab2" x="64" y="327">Fix Numbers</text>
<text class="mono2" x="38" y="358">fixed_numbers</text>
<text class="note" x="38" y="384">ссылки стали числами</text>
<line x1="335.0" y1="280" x2="335.0" y2="299" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="236" y="300" width="198" height="110" fill="#dbeafe" stroke="#1e88e5" stroke-width="1.6" rx="8"/>
<circle cx="256" cy="322" r="11" fill="#1e88e5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="256" y="326.5">6</text>
<text class="lab2" x="274" y="327">Fix Links</text>
<text class="mono2" x="248" y="358">fixed_excels</text>
<text class="note" x="248" y="384">формулы живые</text>
<line x1="545.0" y1="280" x2="545.0" y2="299" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="446" y="300" width="198" height="110" fill="#dbeafe" stroke="#1e88e5" stroke-width="1.6" rx="8"/>
<circle cx="466" cy="322" r="11" fill="#1e88e5" stroke="#fff" stroke-width="1.5"/><text class="numt" x="466" y="326.5">6</text>
<text class="lab2" x="484" y="327">Merge DFL</text>
<text class="mono2" x="458" y="358">_DFL_summary.xlsx</text>
<text class="note" x="458" y="384">сводный лист</text>
<line x1="755.0" y1="280" x2="755.0" y2="299" stroke="#3a3f44" stroke-width="1.3" marker-end="url(#arrInk)"/>
<rect x="656" y="300" width="198" height="110" fill="#dff2df" stroke="#2e7d32" stroke-width="2.4" rx="8"/>
<circle cx="676" cy="322" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="676" y="326.5">6</text>
<text class="lab2" x="694" y="327">Process Excels</text>
<text class="mono2" x="668" y="358">processed_excels</text>
<text class="green" x="668" y="384">файл для сдачи</text>
</svg>
