<circle cx="606" cy="62" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="66.5">1</text>
<text class="lab2" x="626" y="67">Bottom plate</text>
<text class="note" x="626" y="85">низ стены; на бетоне P.T.</text>
<circle cx="606" cy="116" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="120.5">2</text>
<text class="lab2" x="626" y="121">Double top plate</text>
<text class="note" x="626" y="139">две доски поверху</text>
<circle cx="606" cy="170" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="174.5">3</text>
<text class="lab2" x="626" y="175">Studs 16" o.c.</text>
<text class="note" x="626" y="193">рядовые стойки</text>
<circle cx="606" cy="224" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="228.5">4</text>
