<circle cx="606" cy="332" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="336.5">6</text>
<text class="lab2" x="626" y="337">Header</text>
<text class="note" x="626" y="355">(2) 2x10, LVL: по schedule</text>
<circle cx="606" cy="386" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="390.5">7</text>
<text class="lab2" x="626" y="391">Cripples</text>
<text class="note" x="626" y="409">над header и под sill</text>
<circle cx="606" cy="440" r="11" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/><text class="numt" x="606" y="444.5">8</text>
<text class="lab2" x="626" y="445">Sill</text>
<text class="note" x="626" y="463">низ проёма окна; у двери нет</text>
<text class="note" x="50" y="520">Стена в книге: plates в LFT, studs штуками по высоте стены, header отдельной строкой по проёмам.</text>
