<svg xmlns="http://www.w3.org/2000/svg" width="890" height="912" viewBox="0 0 890 912" role="img" aria-labelledby="t d">
  <title id="t">All sections and blocks of the finished file</title>
  <desc id="d">Sections from top to bottom in the order of construction, with what each holds: header notes, foundation, then floor by floor the framing list with its blocks and the walls, then gables, parapets, Wall Materials, roof and finishes.</desc>
  <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#1f2328}.cb{font-size:12.5px;font-weight:700}.cbr{font-size:12.5px;font-weight:700;fill:#c00000}.d{font-size:12px;fill:#4b5158}.tag{font-size:12px;font-weight:700;fill:#2e7d32}.bt{font-size:13.5px;font-weight:600}</style>
  <rect width="890" height="912" fill="#ffffff"/>
  <rect x="62" y="175" width="812" height="182" rx="8" fill="#f3f8f3" stroke="#c9dfca" stroke-width="1"/>
  <text class="tag" x="864" y="192" text-anchor="end">Этаж 1</text>
  <rect x="62" y="363" width="812" height="134" rx="8" fill="#f3f8f3" stroke="#c9dfca" stroke-width="1"/>
  <text class="tag" x="864" y="380" text-anchor="end">Этаж 2</text>
  <rect x="62" y="503" width="812" height="62" rx="8" fill="#f3f8f3" stroke="#c9dfca" stroke-width="1"/>
  <text class="tag" x="864" y="520" text-anchor="end">Этаж 3 и выше</text>
  <rect x="70" y="16" width="300" height="24" fill="#CCFFFF" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="32">Detailed Material List</text>
  <text class="d" x="382" y="32">начало таблицы</text>
  <rect x="70" y="40" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cbr" x="78" y="56">Important: на жёлтом</text>
  <text class="d" x="382" y="56">решения на весь дом, красный жирный: EWP и trusses by others, existing, budget</text>
  <rect x="70" y="64" width="300" height="24" fill="#ffffff" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cbr" x="78" y="80">Note: без заливки</text>
  <text class="d" x="382" y="80">остальные заметки шапки, красный жирный: расхождения листов, допущения</text>
  <rect x="70" y="88" width="300" height="24" fill="#f2f3f5" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="104">Description, Size, Quantities, Units</text>
  <text class="d" x="382" y="104">шапка столбцов A:F</text>
  <rect x="70" y="124" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="140">Foundation Walls</text>
  <text class="d" x="382" y="140">sill sealer, termite shield, sill plate, anchor bolts, washers</text>
  <rect x="70" y="148" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="164">Basement Floor Walls</text>
  <text class="d" x="382" y="164">plates P.T., studs, blocking, bracing, flashing, box sheathing, holdowns</text>
  <rect x="70" y="182" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="198">1st Floor Framing List</text>
  <text class="d" x="382" y="198">columns, beams, joists, rim, blocking, bracing, лестницы, subfloor</text>
  <rect x="100" y="206" width="270" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="222">Rear Ground Deck Frame</text>
  <text class="d" x="382" y="222">posts, bases, beams, ledger, joists, hangers</text>
  <rect x="100" y="230" width="270" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="246">Ground Deck Decking (rear)</text>
  <text class="d" x="382" y="246">decking, deck fascia, risers</text>
  <rect x="100" y="254" width="270" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="270">Ground Deck Railing (rear)</text>
  <text class="d" x="382" y="270">posts at rails, sleeves, caps, rail sections</text>
  <rect x="100" y="278" width="270" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="294">Front Porch Framing List</text>
  <text class="d" x="382" y="294">posts, beam, ceiling joists, ledger, rafters, hangers</text>
  <rect x="100" y="302" width="270" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="318">Porch Trims</text>
  <text class="d" x="382" y="318">fascia, soffits, post wrap (если отделка в scope)</text>
  <rect x="70" y="326" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="342">1st Floor Walls</text>
  <text class="d" x="382" y="342">bracing, flashing, studs, plates, headers, WRB, sheathing, tape, holdowns</text>
  <rect x="70" y="370" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="386">2nd Floor Framing List</text>
  <text class="d" x="382" y="386">то же, что на 1-м этаже: балки, joists, лестницы, subfloor</text>
  <rect x="100" y="394" width="270" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="410">#1 Upper Balcony List</text>
  <text class="d" x="382" y="410">posts, beams, connectors, bolts, ledger, joists, hangers</text>
  <rect x="100" y="418" width="270" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="434">#1 Upper Balcony Decking and Railing</text>
  <text class="d" x="382" y="434">decking, posts at rails, rail sections</text>
  <rect x="100" y="442" width="270" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="108" y="458">Balcony Trims</text>
  <text class="d" x="382" y="458">fascia, soffits, post wrap (если отделка в scope)</text>
  <rect x="70" y="466" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="482">2nd Floor Walls</text>
  <text class="d" x="382" y="482">тот же состав, что у стен 1-го этажа</text>
  <rect x="70" y="510" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="526">3rd ... Nth Floor Framing List</text>
  <text class="d" x="382" y="526">перекрытие и блоки этого этажа</text>
  <rect x="70" y="534" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="550">3rd ... Nth Floor Walls</text>
  <text class="d" x="382" y="550">стены этого этажа, дальше следующий этаж</text>
  <rect x="70" y="580" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="596">Loft Framing List</text>
  <text class="d" x="382" y="596">сразу за верхними стенами</text>
  <rect x="70" y="604" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="620">Gable Walls</text>
  <text class="d" x="382" y="620">studs for gables, sheathing, bracing, blocking, draft stop</text>
  <rect x="70" y="628" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="644">Truss Heel, Parapet Walls, Shaft walls</text>
  <text class="d" x="382" y="644">обшивка пятки ферм, парапет и coping, shaft liner и channels</text>
  <rect x="70" y="652" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="668">Wall Materials, Ceiling Materials</text>
  <text class="d" x="382" y="668">blocking и jambs по деталям, рамы подвесных потолков</text>
  <rect x="70" y="688" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="704">Roof Frame list</text>
  <text class="d" x="382" y="704">ridge, rafters, ledger, ties, draft stop</text>
  <rect x="70" y="712" width="300" height="24" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="728">Roof System Misc</text>
  <text class="d" x="382" y="728">обшивка кровли по уклонам, H-clips, sub fascia, blocking at eves</text>
  <rect x="70" y="748" width="300" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="764">Roof Products</text>
  <text class="d" x="382" y="764">если кровля в scope: shingles, felt, flashing, vents</text>
  <rect x="70" y="772" width="300" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="788">Soffits and Fascias, Exterior Trims</text>
  <text class="d" x="382" y="788">если отделка в scope: fascia, frieze, casing, corner boards</text>
  <rect x="70" y="796" width="300" height="24" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="812">Siding</text>
  <text class="d" x="382" y="812">если сайдинг в scope</text>
  <rect x="70" y="832" width="300" height="24" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="cb" x="78" y="848">Interior Doors&amp;Trims</text>
  <text class="d" x="382" y="848">если в scope: двери, base, casing, crowns по этажам</text>
  <path d="M52,175 L38,175 L38,736 L52,736" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text transform="rotate(-90 26 455.5)" class="bt" x="26" y="455.5" text-anchor="middle">Framing</text>
  <text class="cb" x="70" y="891">Цвет заголовка:</text>
  <rect x="176" y="878" width="18" height="18" fill="#FFFF00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="d" x="200" y="892">стены, фундамент, Interior</text>
  <rect x="362" y="878" width="18" height="18" fill="#99CC00" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="d" x="386" y="892">framing lists, каркас блоков, кровля</text>
  <rect x="590" y="878" width="18" height="18" fill="#CCFFCC" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="d" x="614" y="892">decking, railing, trims, отделка</text>
  <rect x="776" y="878" width="18" height="18" fill="#CCFFFF" stroke="#3a3f44" stroke-width="0.8"/>
  <text class="d" x="800" y="892">начало таблицы</text>
</svg>
