<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="t d">
  <title id="t">Work process: from the client folder to .Finished, eight steps</title>
  <desc id="d">Eight numbered blocks in three rows, read as a snake: project received, PDF analysis, project in OurPlanCore, measuring by the Work menu, Excel DFL and notes, check, export, delivery; a branch from export for revisions with Changes.txt. Colour shows who does the step: grey automation at intake, green estimator, blue delivery.</desc>
  <defs>
    <marker id="arrInk" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L0,9 L10,5 z" fill="#3a3f44"/></marker>
    <style>
      .lab{font:600 16px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .note{font:400 15px Inter, "Segoe UI", Arial, sans-serif;fill:#374151}
      .num{font:700 15px Inter, "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .leg-h{font:600 14px Inter, "Segoe UI", Arial, sans-serif;fill:#1f2a1f}
      .leg{font:400 14px Inter, "Segoe UI", Arial, sans-serif;fill:#374151}
    </style>
  </defs>
<rect x="0.5" y="0.5" width="879" height="643" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
<rect x="24" y="24" width="256" height="164" rx="10" fill="#e9ecef" stroke="#6b7378" stroke-width="2"/>
<circle cx="52" cy="51" r="15" fill="#6b7378"/><text class="num" x="52" y="56.5">1</text>
<text class="lab" x="75" y="57">Проект пришёл</text>
<text class="note" x="40" y="88">Dropbox, номер, папка,</text>
<text class="note" x="40" y="110">scope</text>
<rect x="312" y="24" width="256" height="164" rx="10" fill="#e9ecef" stroke="#6b7378" stroke-width="2"/>
<circle cx="340" cy="51" r="15" fill="#6b7378"/><text class="num" x="340" y="56.5">2</text>
<text class="lab" x="363" y="57">Анализ PDF</text>
<text class="note" x="328" y="88">листы, обшивка, масштабы,</text>
<text class="note" x="328" y="110">противоречия</text>
<rect x="600" y="24" width="256" height="164" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/>
<path d="M600,34 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v94 h-256 z" fill="#e9ecef" stroke="none"/>
<line x1="600" y1="128" x2="856" y2="128" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
<rect x="600" y="24" width="256" height="164" rx="10" fill="none" stroke="#2e7d32" stroke-width="2"/>
<circle cx="628" cy="51" r="15" fill="#6b7378"/><text class="num" x="628" y="56.5">3</text>
<text class="lab" x="651" y="57">Проект в OurPlanCore</text>
<text class="note" x="616" y="88">авто: имена листов,</text>
<text class="note" x="616" y="110">масштаб, точки W/F/S/U</text>
<text class="note" x="616" y="150">эстиматор: Auto Tree,</text>
<text class="note" x="616" y="172">Excel по корпусам</text>
<rect x="600" y="232" width="256" height="126" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/>
<circle cx="628" cy="259" r="15" fill="#2e7d32"/><text class="num" x="628" y="264.5">4</text>
<text class="lab" x="651" y="265">Замеры по меню Работа</text>
<text class="note" x="616" y="296">walls, openings, sheathing,</text>
<text class="note" x="616" y="318">sqfts, framing, shear,</text>
<text class="note" x="616" y="340">eves, deck</text>
<rect x="312" y="232" width="256" height="126" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/>
<circle cx="340" cy="259" r="15" fill="#2e7d32"/><text class="num" x="340" y="264.5">5</text>
<text class="lab" x="363" y="265">Excel DFL и ноты</text>
<text class="note" x="328" y="296">полоса XL, ноты, формулы</text>
<rect x="24" y="232" width="256" height="126" rx="10" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/>
<circle cx="52" cy="259" r="15" fill="#2e7d32"/><text class="num" x="52" y="264.5">6</text>
<text class="lab" x="75" y="265">Проверка</text>
<text class="note" x="40" y="296">чек-лист, Estimating Total</text>
<rect x="24" y="402" width="256" height="126" rx="10" fill="#dbeafe" stroke="#1e88e5" stroke-width="2"/>
<circle cx="52" cy="429" r="15" fill="#1e88e5"/><text class="num" x="52" y="434.5">7</text>
<text class="lab" x="75" y="435">Экспорт</text>
<text class="note" x="40" y="466">PDF только листов</text>
<text class="note" x="40" y="488">с замерами, по корпусам;</text>
<text class="note" x="40" y="510">processed xlsx</text>
<rect x="312" y="402" width="256" height="126" rx="10" fill="#dbeafe" stroke="#1e88e5" stroke-width="2"/>
<circle cx="340" cy="429" r="15" fill="#1e88e5"/><text class="num" x="340" y="434.5">8</text>
<text class="lab" x="363" y="435">Сдача</text>
<text class="note" x="328" y="466">.Finished,</text>
<text class="note" x="328" y="488">имя как при приёме</text>
<line x1="280" y1="76" x2="311" y2="76" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="568" y1="76" x2="599" y2="76" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="728" y1="188" x2="728" y2="231" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="600" y1="295" x2="569" y2="295" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="312" y1="295" x2="281" y2="295" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="152" y1="358" x2="152" y2="401" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="280" y1="465" x2="311" y2="465" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<line x1="152" y1="528" x2="152" y2="557" stroke="#3a3f44" stroke-width="2.2" marker-end="url(#arrInk)"/>
<rect x="24" y="558" width="256" height="62" rx="10" fill="#fff" stroke="#1e88e5" stroke-width="2" stroke-dasharray="7 5"/>
<text class="lab" x="40" y="584">Ревизия: Changes.txt</text>
<text class="note" x="40" y="606">секции Changes и Open items</text>
<rect x="600" y="402" width="256" height="126" rx="10" fill="#f6f8f6" stroke="#cfd8cf" stroke-width="1.2"/>
<text class="leg-h" x="616" y="430">Цвет = кто делает шаг</text>
<rect x="616" y="448" width="28" height="18" rx="4" fill="#e9ecef" stroke="#6b7378" stroke-width="2"/>
<text class="leg" x="654" y="462">автоматика при приёме</text>
<rect x="616" y="474" width="28" height="18" rx="4" fill="#dff2df" stroke="#2e7d32" stroke-width="2"/>
<text class="leg" x="654" y="488">эстиматор</text>
<rect x="616" y="500" width="28" height="18" rx="4" fill="#dbeafe" stroke="#1e88e5" stroke-width="2"/>
<text class="leg" x="654" y="514">сдача</text>
</svg>
