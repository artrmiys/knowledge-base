<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">Residential job: house, garage and porch and the takeoff tree branches they produce</title>
  <desc id="d">Front elevation of a two-storey house with a gable roof, an attached garage with a lower pitched roof and a front porch. Numbers on the parts match the list of takeoff tree paths on the right.</desc>
