# Runs from the stock node image with the code mounted read-only: no build, no npm install.
services:
  kb-feedback:
    image: node:24-bookworm-slim
    container_name: kb_feedback
    restart: unless-stopped
    user: "1000:1001"
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - ./app:/app:ro
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - public_proxy

networks:
  public_proxy:
    external: true
